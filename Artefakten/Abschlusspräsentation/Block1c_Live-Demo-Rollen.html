<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LearnFlow — Live Demo: Rollen</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f5f0;
      --ink: #101e36;
      --text: #253247;
      --muted: #6f7886;
      --line: #ded9ce;
      --teal: #0fa8a0;
      --teal-dark: #087d78;
      --teal-pale: #e4f6f4;
      --amber: #bf8830;
      --amber-dark: #8a5f1e;
      --amber-pale: #f7edd9;
      --coral: #cf665c;
      --coral-dark: #a8453c;
      --coral-pale: #fae8e5;
      --white: #fffefb;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dcd8d0;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
    }

    .stage {
      position: relative;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      transform-origin: center center;
      background:
        radial-gradient(circle at 88% 16%, rgba(15, 168, 160, .10), transparent 25%),
        linear-gradient(112deg, var(--paper) 0%, var(--paper) 62%, #f3f0e9 100%);
      box-shadow: 0 30px 80px rgba(16, 30, 54, .18);
    }

    .topbar {
      position: absolute;
      z-index: 2;
      top: 54px;
      left: 70px;
      right: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      color: var(--ink);
      font-weight: 820;
      font-size: 22px;
      letter-spacing: -.04em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--ink);
      color: var(--white);
      font-size: 15px;
      letter-spacing: -.02em;
    }

    .context {
      color: var(--muted);
      font-size: 15px;
      font-weight: 720;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .content {
      position: absolute;
      inset: 168px 70px 90px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      color: var(--teal-dark);
      font-size: 15px;
      font-weight: 790;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 42px; height: 3px; border-radius: 3px; background: var(--teal); }

    h1 {
      margin: 0 0 48px;
      max-width: 1000px;
      color: var(--ink);
      font-size: 52px;
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    .groups {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 26px;
    }

    .group {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 28px 32px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 254, 251, .82);
      box-shadow: 0 14px 32px rgba(16, 30, 54, .07);
      text-align: center;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      margin-bottom: 20px;
    }
    .avatar svg { width: 36px; height: 36px; }

    .group.stefan .avatar { background: var(--teal-pale); color: var(--teal-dark); }
    .group.lara .avatar { background: var(--amber-pale); color: var(--amber-dark); }
    .group.admin .avatar { background: var(--coral-pale); color: var(--coral-dark); }

    .persona-name {
      color: var(--ink);
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .persona-role {
      margin-top: 4px;
      margin-bottom: 26px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .actions {
      display: grid;
      gap: 14px;
      width: 100%;
      text-align: left;
    }

    .action-item {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      color: var(--text);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
    }
    .action-item svg {
      flex: 0 0 auto;
      width: 19px;
      height: 19px;
      margin-top: 2px;
    }

    .group.stefan .action-item svg { color: var(--teal-dark); }
    .group.lara .action-item svg { color: var(--amber-dark); }
    .group.admin .action-item svg { color: var(--coral-dark); }
  </style>
</head>
<body>
  <div class="stage">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">LF</span>
        <span>LearnFlow</span>
      </div>
      <div class="context">Interne RAG-Lernplattform</div>
    </header>

    <section class="content">
      <div class="eyebrow">Live Demo</div>
      <h1>Wer macht was?</h1>

      <div class="groups">
        <div class="group stefan">
          <div class="avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="persona-name">Stefan</div>
          <div class="persona-role">Senior</div>
          <div class="actions">
            <div class="action-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              <span>Entscheidet, welche Dokumente hochgeladen werden</span>
            </div>
            <div class="action-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              <span>Generiert Quiz-Fragen und gibt sie frei</span>
            </div>
          </div>
        </div>

        <div class="group lara">
          <div class="avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="persona-name">Lara</div>
          <div class="persona-role">Junior</div>
          <div class="actions">
            <div class="action-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              <span>Stellt eine Frage</span>
            </div>
            <div class="action-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              <span>Bewertet Antworten (👍/👎)</span>
            </div>
            <div class="action-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              <span>Füllt das Quiz aus</span>
            </div>
          </div>
        </div>

        <div class="group admin">
          <div class="avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
          </div>
          <div class="persona-name">Administrator</div>
          <div class="persona-role">System</div>
          <div class="actions">
            <div class="action-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              <span>Stellt die Parameter ein</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const stage = document.querySelector('.stage');
    function fitStage() {
      const scale = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fitStage);
    fitStage();

    window.addEventListener('keydown', event => {
      if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) {
        window.parent.postMessage({ type: 'learnflow-block-nav', direction: 1 }, '*');
      }
      if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) {
        window.parent.postMessage({ type: 'learnflow-block-nav', direction: -1 }, '*');
      }
    });
  </script>
</body>
</html>
