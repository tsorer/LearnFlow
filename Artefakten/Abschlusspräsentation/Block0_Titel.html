<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LearnFlow — Titel &amp; Team</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f5f0;
      --ink: #101e36;
      --text: #253247;
      --muted: #6f7886;
      --line: #ded9ce;
      --teal: #0fa8a0;
      --teal-dark: #087d78;
      --teal-pale: #e4f6f4;
      --white: #fffefb;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dcd8d0;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
    }

    .stage {
      position: relative;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      transform-origin: center center;
      background:
        radial-gradient(circle at 88% 16%, rgba(15, 168, 160, .10), transparent 25%),
        linear-gradient(112deg, var(--paper) 0%, var(--paper) 62%, #f3f0e9 100%);
      box-shadow: 0 30px 80px rgba(16, 30, 54, .18);
    }

    .content {
      position: absolute;
      inset: 0;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 64px;
      padding: 90px 100px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      text-align: center;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      border-radius: 20px;
      background: var(--ink);
      color: var(--white);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 104px;
      font-weight: 830;
      line-height: 1;
      letter-spacing: -.045em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 20px;
      font-weight: 650;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .team {
      width: 100%;
      max-width: 1280px;
    }

    .team-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
      color: var(--teal-dark);
      font-size: 16px;
      font-weight: 790;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .team-label::before,
    .team-label::after {
      content: "";
      width: 42px;
      height: 3px;
      border-radius: 3px;
      background: var(--teal);
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .member {
      padding: 26px 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 254, 251, .82);
      box-shadow: 0 14px 30px rgba(16, 30, 54, .07);
      text-align: center;
    }

    .member .name {
      color: var(--ink);
      font-size: 20px;
      font-weight: 790;
      letter-spacing: -.02em;
      line-height: 1.25;
    }

    .member .role {
      margin-top: 10px;
      color: var(--text);
      font-size: 15px;
      font-weight: 620;
      line-height: 1.4;
    }

    .member .org {
      margin-top: 3px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="stage">
    <section class="content">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">LF</div>
        <h1>LearnFlow</h1>
        <p class="subtitle">Abschlusspräsentation</p>
      </div>

      <div class="team">
        <div class="team-label">Team</div>
        <div class="team-grid">
          <div class="member">
            <div class="name">Frank Moritz</div>
            <div class="role">C#-Entwickler</div>
            <div class="org">Glaux Group AG</div>
          </div>
          <div class="member">
            <div class="name">Niklaus Lüthi</div>
            <div class="role">Full-Stack-Softwareentwickler (.NET)</div>
            <div class="org">Lestra Engineering (eigene Firma)</div>
          </div>
          <div class="member">
            <div class="name">Christoph Amstutz</div>
            <div class="role">Augenarzt</div>
            <div class="org">Kantonsspital Luzern</div>
          </div>
          <div class="member">
            <div class="name">Reto Stucki</div>
            <div class="role">C#-Entwickler</div>
            <div class="org">Nowhow Solutions AG</div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const stage = document.querySelector('.stage');
    function fitStage() {
      const scale = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fitStage);
    fitStage();

    window.addEventListener('keydown', event => {
      if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) {
        window.parent.postMessage({ type: 'learnflow-block-nav', direction: 1 }, '*');
      }
      if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) {
        window.parent.postMessage({ type: 'learnflow-block-nav', direction: -1 }, '*');
      }
    });
  </script>
</body>
</html>
