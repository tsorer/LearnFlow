<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LearnFlow — Abschlusspräsentation (Gesamt)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #101e36;
      --text: #253247;
      --muted: #6f7886;
      --line: #ded9ce;
      --teal: #0fa8a0;
      --teal-dark: #087d78;
      --paper: #f7f5f0;
      --bar-h: 46px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #dcd8d0;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }
    .bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--bar-h);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--ink);
      color: #fffefb;
      z-index: 10;
      padding: 0 16px;
      font-size: 13px;
      letter-spacing: .01em;
    }
    .bar button {
      appearance: none;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.06);
      color: #fffefb;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s ease;
    }
    .bar button:hover:not(:disabled) { background: rgba(255,255,255,.16); }
    .bar button:disabled { opacity: .3; cursor: default; }
    .bar .title {
      min-width: 260px;
      text-align: center;
      font-weight: 600;
    }
    .bar .title small {
      display: block;
      font-weight: 400;
      color: var(--teal);
      letter-spacing: .04em;
      font-size: 11px;
      margin-top: 1px;
    }
    .dots {
      display: flex;
      gap: 7px;
      margin-left: 6px;
    }
    .dots button {
      width: 9px;
      height: 9px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.4);
      background: transparent;
    }
    .dots button.active {
      background: var(--teal);
      border-color: var(--teal);
    }
    .stage-wrap {
      position: absolute;
      top: var(--bar-h);
      left: 0; right: 0; bottom: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #dcd8d0;
    }
    .hint {
      position: fixed;
      bottom: 10px;
      right: 14px;
      font-size: 11px;
      color: rgba(16,30,54,.55);
      background: rgba(255,255,255,.6);
      padding: 3px 8px;
      border-radius: 5px;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="bar">
    <button id="prevBtn" title="Vorheriger Block (Taste ,)">◀ Block</button>
    <div class="title">
      <span id="blockLabel">Block 1 von 5</span>
      <small id="blockName"></small>
    </div>
    <button id="nextBtn" title="Nächster Block (Taste .)">Block ▶</button>
    <div class="dots" id="dots"></div>
  </div>
  <div class="stage-wrap">
    <iframe id="stageFrame" title="Präsentationsblock"></iframe>
  </div>
  <div class="hint">Pfeiltasten/Space navigieren innerhalb des Blocks · , . wechselt den Block</div>

  <script>
    const blocks = [
      { file: 'Block1_intro.html', name: 'Intro' },
      { file: 'Block1b_Live-Demo.html', name: 'Live Demo' },
      { file: 'Block2_Technischer-Aufbau.html', name: 'Technischer Aufbau' },
      { file: 'Block3_Umsetzung.html', name: 'Umsetzung' },
      { file: 'Block4_learnings.html', name: 'Herausforderungen & Learnings' },
      { file: 'Block5_Fazit-Ausblick.html', name: 'Fazit & Ausblick' },
    ];

    const frame = document.getElementById('stageFrame');
    const label = document.getElementById('blockLabel');
    const name = document.getElementById('blockName');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dotsEl = document.getElementById('dots');

    let current = 0;

    blocks.forEach((b, i) => {
      const dot = document.createElement('button');
      dot.title = b.name;
      dot.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(dot);
    });

    function render() {
      const b = blocks[current];
      frame.src = b.file;
      label.textContent = `Block ${current + 1} von ${blocks.length}`;
      name.textContent = b.name;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === blocks.length - 1;
      [...dotsEl.children].forEach((d, i) => d.classList.toggle('active', i === current));
    }

    function goTo(i) {
      if (i < 0 || i >= blocks.length) return;
      current = i;
      render();
    }

    prevBtn.addEventListener('click', () => goTo(current - 1));
    nextBtn.addEventListener('click', () => goTo(current + 1));

    window.addEventListener('keydown', event => {
      if (event.key === '.') goTo(current + 1);
      if (event.key === ',') goTo(current - 1);
    });

    window.addEventListener('message', event => {
      if (!event.data || event.data.type !== 'learnflow-block-nav') return;
      goTo(current + event.data.direction);
    });

    render();
  </script>
</body>
</html>
