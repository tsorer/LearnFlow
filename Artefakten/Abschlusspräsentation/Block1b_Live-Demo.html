<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LearnFlow — Live Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f5f0;
      --ink: #101e36;
      --text: #253247;
      --muted: #6f7886;
      --teal: #0fa8a0;
      --teal-dark: #087d78;
      --white: #fffefb;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dcd8d0;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
    }

    .stage {
      position: relative;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      transform-origin: center center;
      background:
        radial-gradient(circle at 88% 16%, rgba(15, 168, 160, .10), transparent 25%),
        linear-gradient(112deg, var(--paper) 0%, var(--paper) 62%, #f3f0e9 100%);
      box-shadow: 0 30px 80px rgba(16, 30, 54, .18);
    }

    .topbar {
      position: absolute;
      z-index: 2;
      top: 54px;
      left: 70px;
      right: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      color: var(--ink);
      font-weight: 820;
      font-size: 22px;
      letter-spacing: -.04em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--ink);
      color: var(--white);
      font-size: 15px;
      letter-spacing: -.02em;
    }

    .context {
      color: var(--muted);
      font-size: 15px;
      font-weight: 720;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .center {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 26px;
      color: var(--teal-dark);
      font-size: 16px;
      font-weight: 790;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 42px;
      height: 3px;
      border-radius: 3px;
      background: var(--teal);
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 96px;
      font-weight: 830;
      line-height: 1.02;
      letter-spacing: -.045em;
    }
  </style>
</head>
<body>
  <div class="stage">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">LF</span>
        <span>LearnFlow</span>
      </div>
      <div class="context">Interne RAG-Lernplattform</div>
    </header>

    <section class="center">
      <div>
        <h1>Live Demo</h1>
      </div>
    </section>
  </div>

  <script>
    const stage = document.querySelector('.stage');
    function fitStage() {
      const scale = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fitStage);
    fitStage();
  </script>
</body>
</html>
