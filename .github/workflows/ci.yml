name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    env:
      DATABASE_URL: postgresql://x:x@localhost/x
      JWT_SECRET: ci-dummy-secret-32-chars-minimum!
      OPENAI_API_KEY: sk-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app worker
      - run: pytest

  # T-09: login flow against the full stack (nginx + api + db). Catches the seams
  # the backend/frontend jobs cannot see by construction: the /api rewrite, the
  # SPA fallback, and the real bcrypt hash from the users table.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for the throwaway stack
        run: |
          cp .env.example .env
          # The defaults in .env.example deliberately refuse to start
          # (JWT_SECRET contains "changeme"), so substitute CI values here.
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=ci-e2e-password|' .env
          sed -i 's|^JWT_SECRET=.*|JWT_SECRET=ci-e2e-secret-with-at-least-32-chars|' .env
          # Cost 4 instead of 12: the seed hashes six users, and what is under test
          # here is the chain, not bcrypt's strength (tests/test_auth.py covers that).
          sed -i 's|^BCRYPT_ROUNDS=.*|BCRYPT_ROUNDS=4|' .env
          # WEBAPP_PORT braucht hier nichts mehr zu setzen: seit T-55 (#123)
          # veröffentlicht der e2e-Stack gar keinen Host-Port (docker-compose.e2e.yml),
          # der Test läuft ohnehin stack-intern.
      # Ein Schritt statt drei: `make e2e` fährt seit T-55 sein eigenes
      # Compose-Projekt hoch, seedet und räumt bei Erfolg wieder ab. Damit führt
      # die CI wörtlich denselben Befehl aus wie ein Entwickler lokal — vorher
      # war der lokale Ablauf ein anderer als der hier, und nur einer von beiden
      # war je getestet.
      - run: make e2e
      - name: Container logs on failure
        if: failure()
        run: make e2e-logs
      # Bei Erfolg hat `make e2e` schon abgeräumt; bei einem Fehler lässt es den
      # Stack absichtlich stehen, damit der Schritt darüber noch Logs holen kann.
      # Deshalb hier zusätzlich, und `if: always()` als Netz.
      - name: Tear down the stack
        if: always()
        run: make e2e-down

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test
