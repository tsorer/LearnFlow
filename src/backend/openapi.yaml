openapi: 3.0.3
info:
  title: LearnFlow API
  version: 0.1.0
  description: >
    Verbindliche Schnittstellen-Definition (API-First, ADR-010). Grundgerüst (T-03):
    Endpunkte aus US-01..US-05 als Stubs. Auth (US-05) und Dokument-Upload (US-04) sind
    mit vollständigen Request/Response-Schemas ausmodelliert; die übrigen Endpunkte sind
    bewusst leere Stubs und werden in den jeweiligen Folge-Issues ausmodelliert.

servers:
  - url: /

tags:
  - name: auth
    description: Authentifizierung und Bereichszuordnung (US-05)
  - name: query
    description: Quellenbelegte Frage-Antwort inkl. Konfidenz (US-01, US-02)
  - name: feedback
    description: Feedback zu Antworten (US-03)
  - name: documents
    description: Lernkorpus-Verwaltung / Dokument-Upload (US-04)
  - name: admin
    description: Laufzeit-Konfiguration (US-11)
  - name: quiz
    description: Generierung und Review von Quiz-Fragen (US-07, US-08)
  - name: infra
    description: Betriebs-Endpunkte ohne fachliche Bedeutung

# JWT-Bearer global; Login überschreibt mit security: [] (Pre-Auth).
security:
  - bearerAuth: []

paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Anmeldung mit E-Mail/Passwort, liefert JWT (US-05)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Erfolgreiche Anmeldung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Ungültige Anmeldedaten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Zu viele Login-Versuche (Rate Limit, 5/Minute pro Client-IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/me:
    get:
      tags: [auth]
      summary: Aktuell angemeldeten Benutzer abrufen (US-05)
      responses:
        '200':
          description: Benutzerinformationen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Abmeldung (US-05)
      responses:
        '204':
          description: Abgemeldet
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/query:
    post:
      tags: [query]
      summary: Frage stellen, quellenbelegte Antwort erhalten (US-01, US-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Antwort mit Quellen und Konfidenz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            Frage fehlt oder verletzt die Längengrenzen (3 bis 1000 Zeichen).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: >
            Zu viele Fragen (Rate Limit, 10/Minute pro Konto). Anders als beim
            Login zählt hier das angemeldete Konto und nicht die Client-IP —
            der Endpoint ist authentifiziert, und im Pilot teilen sich die
            Nutzer eine NAT-Adresse (Docs/03_QualityAttributes.md, Security).
            Schutz vor Schleifen und Missbrauch, keine Kostenobergrenze.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: >
            Retrieval oder Antwortgenerierung nicht verfügbar (LLM- bzw.
            Embedding-Provider oder Datenbank). Kein fachliches Ergebnis,
            sondern ein Infrastrukturfehler — bewusst nicht als Unterdrückung
            getarnt (ADR-008).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/answers/{answer_id}/feedback:
    post:
      tags: [feedback]
      summary: Antwort bewerten (US-03)
      parameters:
        - name: answer_id
          in: path
          required: true
          description: '`answer_id` aus der QueryResponse'
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '204':
          description: Feedback gespeichert
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Antwort nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: >-
            Kategorie passt nicht zu helpful (vier Gründe für 👍,
            fünf für 👎 — US-03)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/feedback:
    get:
      tags: [feedback]
      summary: Alle Feedbacks lesen (T-32)
      description: >
        Stefans Bereichs-Uebersicht: Bewertung, Kategorie und Freitext ueber
        alle Antworten, ohne Personenbezug -- die Antwort traegt bewusst keine
        `answer_id` und keinen sonstigen Bezug auf `answers`/`query_sessions`,
        obwohl beide ueber `feedback.answer_id` erreichbar waeren. Auch die
        Frage selbst ist nicht Teil der Antwort: sie ist Freitext einer
        Lernenden und beim Nutzerkreis des Piloten (< 30 Personen,
        Docs/06_Architecture-Draft.md) potenziell re-identifizierend, wie
        bereits fuer US-10 entschieden (Cluster < 5 Fragen werden dort aus
        demselben Grund nicht angezeigt). `answer_id` bleibt nur AK-relevant
        fuer T-30, nicht fuer T-32.

        Nicht nach Bereich gefiltert, aus demselben Grund wie
        `GET /api/quiz/questions`: im MVP gibt es nur `PILOT_AREA` und am
        Konto kein `area`-Feld.
      parameters:
        - name: helpful
          in: query
          required: false
          description: Ohne Angabe beide Werte.
          schema:
            type: boolean
        - name: category
          in: query
          required: false
          description: >
            Ohne Angabe alle Kategorien. Eine mit `helpful` widerspruechliche
            Kombination (z. B. `helpful=true` mit `category=faktisch_falsch`)
            ist kein Fehler, sondern ergibt eine leere Seite -- Filter
            schneiden die Ergebnismenge, sie werden nicht gegeneinander
            validiert.
          schema:
            $ref: '#/components/schemas/FeedbackCategory'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: >
            Eine Seite Feedback, nach `created_at` absteigend. `limit` und
            `offset` wirken innerhalb der gewaehlten Filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackPage'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Keine Berechtigung (Rolle knowledge_owner oder admin erforderlich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`limit` ueber dem Maximum von 200 oder negativer `offset`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/documents:
    get:
      tags: [documents]
      summary: Dokumente des eigenen Bereichs auflisten (US-04)
      responses:
        '200':
          description: Liste der Dokumente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Keine Berechtigung (Rolle knowledge_owner erforderlich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [documents]
      summary: Dokument hochladen; gleicher Dateiname ersetzt das bestehende (US-04, T-15)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
      responses:
        '200':
          description: >-
            Bestehendes Dokument gleichen Namens ersetzt — gleiche id, alte Chunks
            gelöscht, Neu-Indexierung läuft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '201':
          description: Neues Dokument angelegt, Verarbeitung läuft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Keine Berechtigung (Rolle knowledge_owner erforderlich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Datei überschreitet das 10-MB-Limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 'Nicht unterstütztes Dateiformat (erlaubt: PDF, DOCX, Markdown)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: 'Unbekannter Bereich (MVP: nur der hartcodierte Pilot-Bereich)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/{document_id}:
    get:
      tags: [documents]
      summary: Dokument abrufen inkl. Verarbeitungsstatus (US-04)
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dokument mit aktuellem Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Keine Berechtigung (Rolle knowledge_owner erforderlich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Dokument nicht gefunden (auch bei fremdem Bereich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [documents]
      summary: Dokument löschen (US-04)
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Dokument gelöscht
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Keine Berechtigung (Rolle knowledge_owner erforderlich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Dokument nicht gefunden (auch bei fremdem Bereich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/{document_id}/content:
    get:
      tags: [documents]
      summary: Kontextfenster um einen zitierten Chunk abrufen, für den Quellenlink-Viewer (US-01, T-21)
      description: >
        Für jede Rolle erreichbar, nicht nur `knowledge_owner`: eine Antwort auf
        `/api/query` zitiert bereits den Inhalt des Chunks unter `around`, ein
        Lernender darf also öffnen, was ihm ohnehin zitiert wurde. Deshalb ist
        `around` Pflicht und die Antwort ist auf ein Fenster um diesen Chunk
        begrenzt — anders als der zitierte Chunk hat der Rest des Dokuments dem
        Retrieval-Gate für diese Frage nie genügt, und der Endpoint liefert ihn
        deshalb nicht mit. Liefert den geparsten Text, nicht die hochgeladene
        Originaldatei (ADR-003) — der belegende Abschnitt ist der Chunk, und nur
        damit ist "hervorgehoben" ohne Koordinaten-Rückrechnung exakt umsetzbar.
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: around
          in: query
          required: true
          description: chunk_id einer Citation (US-01) — der Chunk, um den das Fenster liegt.
          schema:
            type: string
            format: uuid
        - name: window
          in: query
          required: false
          description: >
            Chunks vor und nach `around`, die zusätzlich mitgeliefert werden
            (US-01 "Abschnitt" — Kontext für den belegenden Chunk, nicht das
            ganze Dokument).
          schema:
            type: integer
            minimum: 0
            maximum: 10
            default: 2
      responses:
        '200':
          description: Fenster von Chunks um `around`, in Lesereihenfolge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentContent'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            Dokument nicht gefunden (auch bei fremdem Bereich), oder `around`
            gehört nicht zu diesem Dokument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            Dokument ist noch nicht `available` (Status `pending`, `processing`
            oder `failed`) — es gibt noch keine oder keine gültigen Chunks zu
            zeigen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/config:
    get:
      tags: [admin]
      summary: Laufzeit-Konfiguration lesen (US-11)
      responses:
        '200':
          description: Alle Konfigurationswerte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Keine Berechtigung (Rolle admin erforderlich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [admin]
      summary: Laufzeit-Konfiguration schreiben (US-11)
      description: >
        Ersetzt die übergebenen Schlüssel; nicht genannte bleiben unverändert.
        Die Werte wirken ohne Neustart (ADR-008). Nur eine Teilmenge der über
        GET gelieferten Schlüssel ist schreibbar (Konfidenz-Bänder und die
        Retrieval-Parameter aus ADR-007); ein nicht schreibbarer Schlüssel mit
        unverändertem Wert wird stillschweigend akzeptiert, mit geändertem Wert
        abgelehnt — das erlaubt es einem Client, die volle GET-Antwort
        unverändert zurückzuschicken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdateRequest'
      responses:
        '200':
          description: Konfiguration nach der Änderung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Keine Berechtigung (Rolle admin erforderlich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            Unbekannter Schlüssel, ungültiger Wert, oder eine echte Änderung an
            einem nicht schreibbaren Schlüssel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/quiz/generate:
    post:
      tags: [quiz]
      summary: Quiz-Fragen aus dem Lernkorpus des Bereichs generieren (US-07)
      description: >
        Zieht eine Zufallsstichprobe indexierter Chunks des Bereichs und laesst
        daraus Multiple-Choice-Fragen erzeugen. Die Fragen werden als `pending`
        gespeichert und sind fuer Lernende erst nach der Freigabe durch den
        Bereichsverantwortlichen sichtbar (US-07) -- die Generierung ist ein
        Vorschlag, keine Veroeffentlichung.
      responses:
        '201':
          description: >
            Fragen erzeugt und gespeichert. Es koennen weniger als fuenf sein:
            Fragen, die den Vertrag verletzen (falsche Anzahl Optionen,
            unbekannte richtige Antwort, erfundene Quellen-Nummer), werden
            verworfen statt korrigiert. `generated` nennt, wie viele
            uebriggeblieben sind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizGenerationResponse'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Keine Berechtigung (Rolle knowledge_owner erforderlich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            Im Bereich ist kein fertig indexiertes Dokument vorhanden. Es gibt
            nichts, woraus Fragen entstehen koennten -- bewusst ein Konflikt mit
            dem Zustand und kein leeres Erfolgsergebnis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: >
            Zu viele Generierungen (Rate Limit, 3/Minute pro Konto). Ein Klick
            loest einen LLM-Batch aus; wie bei /api/query zaehlt das angemeldete
            Konto und nicht die Client-IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: >
            LLM-Provider nicht erreichbar, oder seine Antwort war nicht als die
            vereinbarte Struktur lesbar. Kein fachliches Ergebnis, sondern ein
            Infrastrukturfehler -- bewusst nicht als leeres Ergebnis getarnt
            (ADR-008).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/quiz/questions:
    get:
      tags: [quiz]
      summary: Generierte Quiz-Fragen lesen (US-07, US-08)
      description: >
        Ein Endpoint fuer zwei Oberflaechen: das Review-Board des
        Bereichsverantwortlichen (T-35, alle Status) und das Quiz der Lernenden
        (T-36, nur Freigegebenes). Welche Status sichtbar sind, entscheidet die
        Rolle und nicht der Aufrufer: `knowledge_owner` und `admin` sehen alle
        drei, Lernende ausschliesslich `approved` -- auch bei `?status=pending`.
        Das ist dann eine leere Seite und kein 403: der Parameter schneidet die
        fuer die Rolle erlaubte Teilmenge, er erweitert sie nie (ADR-008,
        fail-closed).

        Nicht nach Bereich gefiltert: US-08 nennt den Pool freigegebener Fragen
        "pro Bereich", im MVP gibt es aber genau einen (`PILOT_AREA`) und am
        Konto kein `area`-Feld, gegen das zu filtern waere. Bewusst vertagt,
        bis Bereiche pro Konto existieren -- dann gehoert der Filter hierher
        und nicht in den Client.
      parameters:
        - name: status
          in: query
          required: false
          description: Ohne Angabe alle fuer die Rolle sichtbaren Status.
          schema:
            $ref: '#/components/schemas/QuizQuestionStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: >
            Eine Seite Fragen, nach `created_at` absteigend. `limit` und
            `offset` wirken innerhalb des gewaehlten Status-Filters und nicht
            ueber alle Status hinweg -- das Board laedt je Spalte eine Seite,
            und ein globales Fenster koennte eine Spalte leer lassen, obwohl
            sie Fragen enthaelt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizQuestionPage'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            Unbekannter `status`, `limit` ueber dem Maximum von 200 oder
            negativer `offset`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/quiz/questions/sample:
    get:
      tags: [quiz]
      summary: Fuenf freigegebene Fragen fuer einen Quiz-Durchlauf ziehen (US-08)
      description: >
        Zieht eine Zufallsstichprobe aus dem Pool der freigegebenen Fragen --
        `GET /api/quiz/questions` kann das nicht sein: es sortiert nach
        `created_at` und liefert damit immer dieselben fuenf neuesten, was eine
        Liste ist und keine Stichprobe. Gezogen wird im SQL, nicht im Client,
        analog `sample_chunks` in app/services/retrieval.py: der Client muesste
        sonst den ganzen Pool laden, um fuenf davon zu behalten.

        Unabhaengig von der Rolle ausschliesslich `approved` -- auch der
        Bereichsverantwortliche sieht hier das Quiz der Lernenden und nicht
        seinen Pruefstand (ADR-008, fail-closed). Weniger als fuenf Fragen sind
        ein normales Ergebnis und kein Fehler: der Bereich enthaelt, was er
        enthaelt.

        Wie beim Lese-Endpoint ohne Bereichsfilter, aus demselben Grund und mit
        derselben Vertagung -- im MVP zieht die Stichprobe aus dem einen
        Bereich, den es gibt.
      responses:
        '200':
          description: >
            Bis zu fuenf freigegebene Fragen in zufaelliger Reihenfolge.
            `total` ist die Groesse des Pools, aus dem gezogen wurde -- damit
            die Quiz-UI einen leeren oder knappen Bestand benennen kann, statt
            eine kurze Runde als vollstaendig auszugeben.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizQuestionPage'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # `question_id`, obwohl der Titel von #98 den Pfad mit `{id}` nennt: die
  # uebrigen Pfade benennen ihren Schluessel nach der Ressource
  # (`/api/documents/{document_id}`, `/api/answers/{answer_id}/feedback`), und
  # ein einzelnes `{id}` waere die Ausnahme. Der generierte Client benennt
  # daraus sein Argument -- die Abweichung waere in jedem Aufruf sichtbar.
  /api/quiz/questions/{question_id}:
    patch:
      tags: [quiz]
      summary: Frage freigeben, ablehnen oder inhaltlich korrigieren (US-07)
      description: >
        Das Urteil des Bereichsverantwortlichen und die Korrektur am Text sind
        derselbe Vorgang, weil sie voneinander abhaengen. `status: approved`
        setzt `approved_at` auf den Zeitpunkt der Freigabe, jeder andere Status
        setzt es auf NULL. Eine inhaltliche Aenderung an einer bereits
        freigegebenen Frage schickt sie zurueck auf `pending` und nullt
        `approved_at` -- ausser derselbe Request bestaetigt die Freigabe mit
        `status: approved` (Editieren und Freigeben in einem Schritt). Sonst
        truege eine Freigabe einen Text, den in dieser Form niemand freigegeben
        hat (ADR-008). Als inhaltliche Aenderung zaehlt nur ein Wert, der vom
        gespeicherten abweicht: eine Oberflaeche, die beim Speichern alle
        Felder unveraendert mitschickt, zieht damit keine Freigabe zurueck.
      parameters:
        - name: question_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizQuestionUpdate'
      responses:
        '200':
          description: Die Frage nach der Aenderung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizQuestion'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Keine Berechtigung (Rolle knowledge_owner erforderlich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Frage nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            Leerer Rumpf, ein nicht schreibbares Feld (`document_id`,
            `chunk_id`, `source_excerpt`), `options` mit einer anderen Anzahl
            als vier, oder ein `correct_answer` ausserhalb von A bis D.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/health:
    get:
      tags: [infra]
      summary: Liveness-Probe für den Docker-Healthcheck
      description: >
        Bewusst ohne Authentifizierung: der Healthcheck läuft im Container ohne
        Zugangsdaten. Gibt keinerlei Zustandsdetails preis.
      security: []
      responses:
        '200':
          description: Service erreichbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: string
      enum: [learner, knowledge_owner, admin]

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Menschenlesbare Fehlerbeschreibung

    ValidationError:
      type: object
      description: >
        FastAPIs Schema-Validierung. Bewusst nicht `Error`: hier ist `detail`
        eine Liste von Einzelfehlern, kein String — ein Client, der beide gleich
        behandelt, liest den falschen Typ.
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc:
                type: array
                description: Pfad zum beanstandeten Feld, z. B. ["body", "question"]
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    TokenResponse:
      type: object
      required: [access_token, token_type, role]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: bearer
        role:
          $ref: '#/components/schemas/Role'

    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    QueryRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 1000
        session_id:
          type: string
          format: uuid
          nullable: true
          description: Fortsetzung einer bestehenden Sitzung; null startet eine neue

    QueryResponse:
      type: object
      description: >
        Antwort der Konfidenz-Pipeline (ADR-008). Bei `suppressed` steht in
        `message` die standardisierte Weiss-ich-nicht-Antwort, nie generierter
        Fliesstext; `citations` darf die nächstliegenden Quellen enthalten,
        damit die Frage präzisiert werden kann (ADR-008, Band «Niedrig»).
      required: [session_id, answer_id, suppressed, citations]
      properties:
        session_id:
          type: string
          format: uuid
        answer_id:
          type: string
          format: uuid
          description: Adressiert das Feedback (POST /api/answers/{answer_id}/feedback)
        suppressed:
          type: boolean
          description: true, wenn eine Stufe der Pipeline unterdrückt hat
        suppression_reason:
          type: string
          nullable: true
          description: >
            Welche Stufe unterdrückt hat (ADR-008). Geschlossene Menge, damit
            das Frontend jeden Wert beschriften kann statt den technischen
            Schlüssel anzuzeigen. Die Reihenfolge der Werte ist die Reihenfolge
            der Stufen; unterdrückt hat immer die erste, die nicht passiert.
            Stufe 2 unterscheidet zwei Fälle, weil sie operativ Verschiedenes
            bedeuten: `citation_coverage` ist eine Schwellenfrage und über
            `min_citation_coverage` kalibrierbar, `citation_invalid` ist eine
            erfundene Referenz und damit ein Modellfehler, der unabhängig von
            jeder Schwelle unterdrückt. `confidence_band` heisst, der
            Komposit-Score liegt unter `confidence_threshold_medium` (T-23),
            `self_check` heisst, die LLM-Verifikation hat ungedeckte Aussagen
            gemeldet oder kein lesbares Urteil geliefert (T-25).
          enum:
            - retrieval_gate
            - retrieval_confidence
            - generation_refused
            - generation_truncated
            - citation_coverage
            - citation_invalid
            - confidence_band
            - self_check
            - configuration_error
        message:
          type: string
          nullable: true
          description: Antworttext, oder die Weiss-ich-nicht-Meldung bei Unterdrückung
        refinement_hint:
          type: string
          nullable: true
          description: >
            Vorschlag zur Präzisierung der Frage (Requirements §71, US-02).
            Nur bei `suppressed`, und je Unterdrückungsgrund ein anderer Text:
            nach «Weiss ich nicht» soll der Hinweis zum nächsten sinnvollen
            Schritt führen, und der ist bei einer zu breiten Frage ein anderer
            als bei einer erfundenen Referenz. null bei einer ausgelieferten
            Antwort — dort gibt es nichts zu präzisieren.
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        confidence:
          allOf:
            - $ref: '#/components/schemas/ConfidenceInfo'
          nullable: true
        debug:
          allOf:
            - $ref: '#/components/schemas/DebugInfo'
          nullable: true
          description: Nur für Rolle admin gefüllt

    Citation:
      type: object
      description: Quellenbeleg auf Chunk-Ebene (US-01)
      # page und heading gehoeren dazu: das Pydantic-Modell (Citation in
      # query.py) hat beide ohne Default, sendet sie also immer -- nullable,
      # aber nie fehlend. Wie DocumentContentChunk unten, das dieselbe
      # Konvention schon richtig anwendet.
      required: [chunk_id, document_id, filename, page, heading, excerpt, index]
      properties:
        chunk_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        filename:
          type: string
        page:
          type: integer
          nullable: true
        heading:
          type: string
          nullable: true
          description: >
            Abschnittsüberschrift des Chunks, sofern beim Parsen erkannt
            (US-01 "Abschnitt"). Identifiziert zusammen mit `chunk_id` den
            Abschnitt, den der Dokument-Viewer hervorhebt (T-21).
        excerpt:
          type: string
        index:
          type: integer
          description: Fussnotennummer im Antworttext

    ConfidenceInfo:
      type: object
      description: Komposit-Score und seine Bestandteile (ADR-008)
      required: [score, retrieval_score, citation_coverage, band]
      properties:
        score:
          type: number
          format: float
          description: >
            Der angezeigte Komposit-Score (ADR-008, T-23): gewichtete
            Kombination aus `retrieval_score` und `citation_coverage`. Lief
            Stufe 2 nicht, ist er die Retrieval-Konfidenz allein — eine Antwort,
            die es nie gab, hat keine Belegquote, die in den Score eingehen
            könnte. Die Herleitung steht in `debug.formula_breakdown`.
        retrieval_score:
          type: number
          format: float
        citation_coverage:
          type: number
          format: float
          description: >
            Anteil der Antwort-Segmente mit gültigem Beleg (ADR-008, Stufe 2).
            0.0 heisst auch «Stufe 2 ist nicht gelaufen» — eine vor der
            Generierung unterdrückte Antwort hat keine Segmente, die belegt
            sein könnten. Ob die Stufe lief, steht in `debug.stages`.
        band:
          type: string
          description: >
            Das Band, in das `score` fällt (ADR-008, US-02): `hoch` ab
            `confidence_threshold_high`, `mittel` ab
            `confidence_threshold_medium`, darunter `niedrig`. `mittel` ist die
            Anzeige «Eingeschränkt belegt», `niedrig` liefert immer eine
            unterdrückte Antwort. Lief Stufe 2 nicht, beschreibt das Band die
            Retrieval-Konfidenz allein und damit die gefundenen Stellen, nicht
            eine beurteilte Antwort — das gilt für jede Unterdrückung vor der
            Citation-Prüfung, auch für `generation_refused` und
            `generation_truncated`, wo bereits generiert wurde.
          enum: [hoch, mittel, niedrig]

    ChunkDebugInfo:
      type: object
      required: [filename, score, above_threshold, in_top_n, dense_rank, content]
      properties:
        filename:
          type: string
        page:
          type: integer
          nullable: true
        heading:
          type: string
          nullable: true
        score:
          type: number
          format: float
        above_threshold:
          type: boolean
        in_top_n:
          type: boolean
        dense_rank:
          type: integer
        content:
          type: string

    StageInfo:
      type: object
      description: >
        Eine Stufe der Defense-in-Depth-Pipeline (ADR-008), in
        Ausführungsreihenfolge. Übersprungene Stufen bleiben in der Liste mit
        `ran: false` — dass eine Stufe nicht lief, ist die Aussage, nicht ihre
        Abwesenheit.
      required: [id, name, ran, passed, detail]
      properties:
        id:
          type: string
          description: >
            Stabiler Schlüssel der Stufe, den die Admin-Ansicht zum Einordnen
            der LLM-Aufrufe benutzt: `retrieval_gate`, `retrieval_confidence`,
            `citation_coverage`, `confidence_band`, `self_check`.
        name:
          type: string
        ran:
          type: boolean
        passed:
          type: boolean
        value:
          oneOf:
            - type: number
            - type: string
          nullable: true
        threshold:
          type: number
          format: float
          nullable: true
        detail:
          type: string

    LLMCallInfo:
      type: object
      required: [step, label, prompt, response]
      properties:
        step:
          type: string
        label:
          type: string
        prompt:
          type: string
        response:
          type: string

    RetrievalDetail:
      type: object
      required: [top_score, mean_score, evidence_density, result, count]
      properties:
        top_score:
          type: number
          format: float
        mean_score:
          type: number
          format: float
        evidence_density:
          type: number
          format: float
        result:
          type: number
          format: float
        count:
          type: integer

    DebugInfo:
      type: object
      description: >
        Nachvollziehbarkeit der Pipeline für die Admin-Ansicht. Nicht Teil des
        fachlichen Vertrags — Felder können sich mit der Pipeline ändern.
      required:
        [chunks, stages, llm_calls, similarity_threshold, min_retrieval_confidence,
         min_citation_coverage, self_check_ran, retrieval_detail, params_used,
         dense_above_threshold, total_dense_retrieved, sparse_count, top_n_used,
         formula_breakdown]
      properties:
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/ChunkDebugInfo'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageInfo'
        llm_calls:
          type: array
          items:
            $ref: '#/components/schemas/LLMCallInfo'
        similarity_threshold:
          type: number
          format: float
        min_retrieval_confidence:
          type: number
          format: float
        min_citation_coverage:
          type: number
          format: float
        self_check_ran:
          type: boolean
          description: >
            Ob Stufe 3 gelaufen ist (ADR-008, T-25). false ist der Normalfall:
            die Stufe kostet einen zweiten LLM-Aufruf und wird nur ausgelöst,
            wenn der Komposit-Score im Grenzband zwischen
            `self_check_band_low` und `self_check_band_high` liegt.
        self_check_verdict:
          type: string
          nullable: true
          description: >
            Das Urteil der Verifikation im Wortlaut des Modells, null wenn die
            Stufe nicht lief. Bewusst der Rohtext und keine Kennzahl: ADR-008
            verwirft die LLM-Selbsteinschätzung als Mass, und was die Stufe
            entschieden hat, steht im `self_check`-Eintrag von `stages`.
        retrieval_detail:
          $ref: '#/components/schemas/RetrievalDetail'
        params_used:
          type: object
          description: >
            Die für diese Anfrage gelesenen `config`-Werte, inklusive der
            Schwellen von Stufen, die nicht gelaufen sind — wer kalibriert,
            braucht alle, nicht nur die ausgelösten. Enthält neben den
            Retrieval-Parametern die Bandgrenzen `confidence_threshold_high`,
            `confidence_threshold_medium` (T-23) sowie `self_check_band_low`
            und `self_check_band_high` (T-25).
          additionalProperties:
            type: number
            nullable: true
        dense_above_threshold:
          type: integer
        total_dense_retrieved:
          type: integer
        sparse_count:
          type: integer
        top_n_used:
          type: integer
        formula_breakdown:
          type: string

    FeedbackCategory:
      type: string
      description: >
        Grund der Bewertung (US-03). Die ersten vier gelten für `helpful: true`,
        die übrigen fünf für `helpful: false`.
      enum:
        - verstaendlich
        - vollstaendig
        - hilfreich_fuer_code
        - quelle_passt_gut
        - faktisch_falsch
        - unvollstaendig
        - veraltet
        - unverstaendlich
        - quelle_stimmt_nicht

    FeedbackRequest:
      type: object
      description: >
        Bewertung einer Antwort (US-03). Wird pseudonymisiert erfasst — die
        Tabelle `feedback` hält bewusst keinen Bezug zur Nutzerin.
      required: [helpful]
      properties:
        helpful:
          type: boolean
          description: 👍 = true, 👎 = false
        category:
          allOf:
            - $ref: '#/components/schemas/FeedbackCategory'
          nullable: true
        comment:
          type: string
          maxLength: 500
          nullable: true
          description: Optionale Freitext-Ergänzung

    FeedbackItem:
      type: object
      description: >
        Eine Zeile in Stefans Bereichs-Uebersicht (T-32). Keine `answer_id`
        und kein sonstiger Bezug auf `answers`/`query_sessions` -- siehe
        Beschreibung von GET /api/feedback.
      required: [id, helpful, category, comment, created_at]
      properties:
        id:
          type: string
          format: uuid
        helpful:
          type: boolean
        category:
          allOf:
            - $ref: '#/components/schemas/FeedbackCategory'
          nullable: true
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    FeedbackPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackItem'
        total:
          description: >
            Anzahl aller Feedbacks der gewaehlten Filter, unabhaengig von
            `limit` und `offset` (analog QuizQuestionPage.total).
          type: integer

    ConfigResponse:
      type: object
      required: [config]
      properties:
        config:
          type: object
          description: Schlüssel-Wert-Paare aus der config-Tabelle; Werte immer als String
          additionalProperties:
            type: string

    ConfigUpdateRequest:
      type: object
      required: [config]
      properties:
        config:
          type: object
          additionalProperties:
            type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    DocumentStatus:
      type: string
      enum: [pending, processing, available, failed]

    DocumentUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Dokument (PDF, DOCX oder Markdown), max. 10 MB
        area:
          type: string
          description: Bereich; im MVP hartcodierter Pilot-Bereich
          default: default

    DocumentResponse:
      type: object
      required: [id, filename, status, area, chunk_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        status:
          $ref: '#/components/schemas/DocumentStatus'
        area:
          type: string
        chunk_count:
          type: integer
        error_message:
          type: string
          nullable: true
        created_at:
          description: Zeitpunkt des ersten Uploads; überlebt eine Ersetzung (T-15)
          type: string
          format: date-time
        updated_at:
          description: Zeitpunkt des Uploads der aktuellen Fassung (T-15)
          type: string
          format: date-time
        uploaded_by:
          description: >-
            E-Mail des Hochladenden der aktuellen Fassung (#92); null, wenn das
            Konto seither gelöscht wurde (FK ON DELETE SET NULL). Erlaubt der
            Upload-UI, vor einer Ersetzung den bisherigen Hochladenden zu nennen.
          type: string
          nullable: true

    DocumentList:
      type: array
      items:
        $ref: '#/components/schemas/DocumentResponse'

    DocumentContentChunk:
      type: object
      description: Ein Chunk in Lesereihenfolge (T-21)
      required: [chunk_id, chunk_index, page, heading, content]
      properties:
        chunk_id:
          type: string
          format: uuid
        chunk_index:
          type: integer
        page:
          type: integer
          nullable: true
        heading:
          type: string
          nullable: true
        content:
          type: string

    DocumentContent:
      type: object
      description: Geparster Dokumentinhalt für den Quellenlink-Viewer (US-01, T-21)
      required: [id, filename, status, chunks]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        status:
          $ref: '#/components/schemas/DocumentStatus'
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/DocumentContentChunk'
          description: Sortiert nach `chunk_index`

    QuizQuestionStatus:
      type: string
      description: >
        Stand der Pruefung durch den Bereichsverantwortlichen (US-07). Eine neu
        generierte Frage ist `pending`; wird das Dokument durch eine neue Fassung
        ersetzt, faellt eine freigegebene Frage hierher zurueck und muss erneut
        geprueft werden (T-15/T-33).
      enum: [pending, approved, rejected]

    QuizQuestion:
      type: object
      required:
        [id, document_id, chunk_id, question, options, correct_answer,
         explanation, source_excerpt, status, created_at, approved_at]
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        chunk_id:
          description: >
            Der belegende Chunk. `null`, sobald das Dokument durch eine neue
            Fassung ersetzt wurde -- die Frage ueberlebt, ihre Quelle im Korpus
            nicht. In dem Fall ist `source_excerpt` das einzige verbliebene
            Zeugnis der Passage.
          type: string
          format: uuid
          nullable: true
        question:
          type: string
        options:
          description: Genau vier Antwortoptionen; `correct_answer` indiziert sie.
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: string
        correct_answer:
          type: string
          enum: [A, B, C, D]
        explanation:
          description: Begruendung der richtigen Antwort aus der Quellen-Passage (US-08)
          type: string
        source_excerpt:
          description: Wortlaut der Passage, aus der die Frage erzeugt wurde (US-07)
          type: string
        status:
          $ref: '#/components/schemas/QuizQuestionStatus'
        created_at:
          description: Zeitpunkt der Generierung
          type: string
          format: date-time
        approved_at:
          description: Zeitpunkt der Freigabe; `null`, solange keine erteilt ist (US-07)
          type: string
          format: date-time
          nullable: true

    QuizGenerationResponse:
      type: object
      required: [generated, questions]
      properties:
        generated:
          description: Anzahl tatsaechlich gespeicherter Fragen
          type: integer
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestion'

    QuizQuestionPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestion'
        total:
          description: >
            Anzahl aller Fragen des gewaehlten Filters, unabhaengig von `limit`
            und `offset`. Bewusst ein Objekt statt eines blanken Arrays: das
            Board zeigt je Spalte eine Anzahl, und `total` nachtraeglich
            einzufuehren waere ein Breaking Change fuer T-35 und T-36.
          type: integer

    QuizQuestionUpdate:
      type: object
      description: >
        Mindestens ein Feld; nicht genannte Felder bleiben unveraendert.
        `document_id`, `chunk_id` und `source_excerpt` fehlen hier nicht
        versehentlich -- sie sind der Beleg der Frage und nicht ihr Inhalt.
        `additionalProperties: false` macht den Schreibversuch darauf zu einem
        422 statt zu einem stillschweigend ignorierten Feld.
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          $ref: '#/components/schemas/QuizQuestionStatus'
        question:
          type: string
          minLength: 1
        options:
          description: Genau vier Antwortoptionen; `correct_answer` indiziert sie.
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: string
            minLength: 1
        correct_answer:
          type: string
          enum: [A, B, C, D]
        explanation:
          type: string
          minLength: 1
