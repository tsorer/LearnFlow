openapi: 3.0.3
info:
  title: LearnFlow API
  version: 0.1.0
  description: >
    Verbindliche Schnittstellen-Definition (API-First, ADR-010). Grundgerüst (T-03):
    Endpunkte aus US-01..US-05 als Stubs. Auth (US-05) und Dokument-Upload (US-04) sind
    mit vollständigen Request/Response-Schemas ausmodelliert; die übrigen Endpunkte sind
    bewusst leere Stubs und werden in den jeweiligen Folge-Issues ausmodelliert.

servers:
  - url: /

tags:
  - name: auth
    description: Authentifizierung und Bereichszuordnung (US-05)
  - name: query
    description: Quellenbelegte Frage-Antwort inkl. Konfidenz (US-01, US-02)
  - name: feedback
    description: Feedback zu Antworten (US-03)
  - name: documents
    description: Lernkorpus-Verwaltung / Dokument-Upload (US-04)
  - name: admin
    description: Laufzeit-Konfiguration (US-11)
  - name: infra
    description: Betriebs-Endpunkte ohne fachliche Bedeutung

# JWT-Bearer global; Login überschreibt mit security: [] (Pre-Auth).
security:
  - bearerAuth: []

paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Anmeldung mit E-Mail/Passwort, liefert JWT (US-05)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Erfolgreiche Anmeldung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Ungültige Anmeldedaten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Zu viele Login-Versuche (Rate Limit, 5/Minute pro Client-IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/me:
    get:
      tags: [auth]
      summary: Aktuell angemeldeten Benutzer abrufen (US-05)
      responses:
        '200':
          description: Benutzerinformationen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Abmeldung (US-05)
      responses:
        '204':
          description: Abgemeldet
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/query:
    post:
      tags: [query]
      summary: Frage stellen, quellenbelegte Antwort erhalten (US-01, US-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Antwort mit Quellen und Konfidenz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            Frage fehlt oder verletzt die Längengrenzen (3 bis 1000 Zeichen).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '503':
          description: >
            Retrieval oder Antwortgenerierung nicht verfügbar (LLM- bzw.
            Embedding-Provider oder Datenbank). Kein fachliches Ergebnis,
            sondern ein Infrastrukturfehler — bewusst nicht als Unterdrückung
            getarnt (ADR-008).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/answers/{answer_id}/feedback:
    post:
      tags: [feedback]
      summary: Antwort bewerten (US-03)
      parameters:
        - name: answer_id
          in: path
          required: true
          description: '`answer_id` aus der QueryResponse'
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '204':
          description: Feedback gespeichert
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Antwort nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: >-
            Kategorie passt nicht zu helpful (vier Gründe für 👍,
            fünf für 👎 — US-03)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents:
    get:
      tags: [documents]
      summary: Dokumente des eigenen Bereichs auflisten (US-04)
      responses:
        '200':
          description: Liste der Dokumente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Keine Berechtigung (Rolle knowledge_owner erforderlich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [documents]
      summary: Dokument hochladen; gleicher Dateiname ersetzt das bestehende (US-04, T-15)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
      responses:
        '200':
          description: >-
            Bestehendes Dokument gleichen Namens ersetzt — gleiche id, alte Chunks
            gelöscht, Neu-Indexierung läuft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '201':
          description: Neues Dokument angelegt, Verarbeitung läuft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Keine Berechtigung (Rolle knowledge_owner erforderlich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Datei überschreitet das 10-MB-Limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 'Nicht unterstütztes Dateiformat (erlaubt: PDF, DOCX, Markdown)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: 'Unbekannter Bereich (MVP: nur der hartcodierte Pilot-Bereich)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/{document_id}:
    get:
      tags: [documents]
      summary: Dokument abrufen inkl. Verarbeitungsstatus (US-04)
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dokument mit aktuellem Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Keine Berechtigung (Rolle knowledge_owner erforderlich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Dokument nicht gefunden (auch bei fremdem Bereich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [documents]
      summary: Dokument löschen (US-04)
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Dokument gelöscht
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Keine Berechtigung (Rolle knowledge_owner erforderlich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Dokument nicht gefunden (auch bei fremdem Bereich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/config:
    get:
      tags: [admin]
      summary: Laufzeit-Konfiguration lesen (US-11)
      responses:
        '200':
          description: Alle Konfigurationswerte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Keine Berechtigung (Rolle admin erforderlich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Noch nicht implementiert (T-37)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [admin]
      summary: Laufzeit-Konfiguration schreiben (US-11)
      description: >
        Ersetzt die übergebenen Schlüssel; nicht genannte bleiben unverändert.
        Die Werte wirken ohne Neustart (ADR-008).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdateRequest'
      responses:
        '200':
          description: Konfiguration nach der Änderung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Keine Berechtigung (Rolle admin erforderlich)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unbekannter Schlüssel oder ungültiger Wert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Noch nicht implementiert (T-37)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/health:
    get:
      tags: [infra]
      summary: Liveness-Probe für den Docker-Healthcheck
      description: >
        Bewusst ohne Authentifizierung: der Healthcheck läuft im Container ohne
        Zugangsdaten. Gibt keinerlei Zustandsdetails preis.
      security: []
      responses:
        '200':
          description: Service erreichbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: string
      enum: [learner, knowledge_owner, admin]

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Menschenlesbare Fehlerbeschreibung

    ValidationError:
      type: object
      description: >
        FastAPIs Schema-Validierung. Bewusst nicht `Error`: hier ist `detail`
        eine Liste von Einzelfehlern, kein String — ein Client, der beide gleich
        behandelt, liest den falschen Typ.
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc:
                type: array
                description: Pfad zum beanstandeten Feld, z. B. ["body", "question"]
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    TokenResponse:
      type: object
      required: [access_token, token_type, role]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: bearer
        role:
          $ref: '#/components/schemas/Role'

    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    QueryRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 1000
        session_id:
          type: string
          format: uuid
          nullable: true
          description: Fortsetzung einer bestehenden Sitzung; null startet eine neue

    QueryResponse:
      type: object
      description: >
        Antwort der Konfidenz-Pipeline (ADR-008). Bei `suppressed` steht in
        `message` die standardisierte Weiss-ich-nicht-Antwort, nie generierter
        Fliesstext; `citations` darf die nächstliegenden Quellen enthalten,
        damit die Frage präzisiert werden kann (ADR-008, Band «Niedrig»).
      required: [session_id, answer_id, suppressed, citations]
      properties:
        session_id:
          type: string
          format: uuid
        answer_id:
          type: string
          format: uuid
          description: Adressiert das Feedback (POST /api/answers/{answer_id}/feedback)
        suppressed:
          type: boolean
          description: true, wenn eine Stufe der Pipeline unterdrückt hat
        suppression_reason:
          type: string
          nullable: true
          description: >
            Welche Stufe unterdrückt hat (ADR-008). Geschlossene Menge, damit
            das Frontend jeden Wert beschriften kann statt den technischen
            Schlüssel anzuzeigen; T-19 und T-25 ergänzen hier
            `citation_coverage` und `self_check`.
          enum:
            - retrieval_gate
            - retrieval_confidence
            - generation_refused
            - generation_truncated
            - configuration_error
        message:
          type: string
          nullable: true
          description: Antworttext, oder die Weiss-ich-nicht-Meldung bei Unterdrückung
        refinement_hint:
          type: string
          nullable: true
          description: Vorschlag zur Präzisierung der Frage
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        confidence:
          allOf:
            - $ref: '#/components/schemas/ConfidenceInfo'
          nullable: true
        debug:
          allOf:
            - $ref: '#/components/schemas/DebugInfo'
          nullable: true
          description: Nur für Rolle admin gefüllt

    Citation:
      type: object
      description: Quellenbeleg auf Chunk-Ebene (US-01)
      required: [chunk_id, document_id, filename, excerpt, index]
      properties:
        chunk_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        filename:
          type: string
        page:
          type: integer
          nullable: true
        excerpt:
          type: string
        index:
          type: integer
          description: Fussnotennummer im Antworttext

    ConfidenceInfo:
      type: object
      description: Komposit-Score und seine Bestandteile (ADR-008)
      required: [score, retrieval_score, citation_coverage]
      properties:
        score:
          type: number
          format: float
        retrieval_score:
          type: number
          format: float
        citation_coverage:
          type: number
          format: float

    ChunkDebugInfo:
      type: object
      required: [filename, score, above_threshold, in_top_n, dense_rank, content]
      properties:
        filename:
          type: string
        page:
          type: integer
          nullable: true
        heading:
          type: string
          nullable: true
        score:
          type: number
          format: float
        above_threshold:
          type: boolean
        in_top_n:
          type: boolean
        dense_rank:
          type: integer
        content:
          type: string

    StageInfo:
      type: object
      description: Eine Stufe der Defense-in-Depth-Pipeline (ADR-008)
      required: [id, name, ran, passed, detail]
      properties:
        id:
          type: string
        name:
          type: string
        ran:
          type: boolean
        passed:
          type: boolean
        value:
          oneOf:
            - type: number
            - type: string
          nullable: true
        threshold:
          type: number
          format: float
          nullable: true
        detail:
          type: string

    LLMCallInfo:
      type: object
      required: [step, label, prompt, response]
      properties:
        step:
          type: string
        label:
          type: string
        prompt:
          type: string
        response:
          type: string

    RetrievalDetail:
      type: object
      required: [top_score, mean_score, evidence_density, result, count]
      properties:
        top_score:
          type: number
          format: float
        mean_score:
          type: number
          format: float
        evidence_density:
          type: number
          format: float
        result:
          type: number
          format: float
        count:
          type: integer

    DebugInfo:
      type: object
      description: >
        Nachvollziehbarkeit der Pipeline für die Admin-Ansicht. Nicht Teil des
        fachlichen Vertrags — Felder können sich mit der Pipeline ändern.
      required:
        [chunks, stages, llm_calls, similarity_threshold, min_retrieval_confidence,
         min_citation_coverage, self_check_ran, retrieval_detail, params_used,
         dense_above_threshold, total_dense_retrieved, sparse_count, top_n_used,
         formula_breakdown]
      properties:
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/ChunkDebugInfo'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageInfo'
        llm_calls:
          type: array
          items:
            $ref: '#/components/schemas/LLMCallInfo'
        similarity_threshold:
          type: number
          format: float
        min_retrieval_confidence:
          type: number
          format: float
        min_citation_coverage:
          type: number
          format: float
        self_check_ran:
          type: boolean
        self_check_verdict:
          type: string
          nullable: true
        retrieval_detail:
          $ref: '#/components/schemas/RetrievalDetail'
        params_used:
          type: object
          additionalProperties:
            type: number
            nullable: true
        dense_above_threshold:
          type: integer
        total_dense_retrieved:
          type: integer
        sparse_count:
          type: integer
        top_n_used:
          type: integer
        formula_breakdown:
          type: string

    FeedbackCategory:
      type: string
      description: >
        Grund der Bewertung (US-03). Die ersten vier gelten für `helpful: true`,
        die übrigen fünf für `helpful: false`.
      enum:
        - verstaendlich
        - vollstaendig
        - hilfreich_fuer_code
        - quelle_passt_gut
        - faktisch_falsch
        - unvollstaendig
        - veraltet
        - unverstaendlich
        - quelle_stimmt_nicht

    FeedbackRequest:
      type: object
      description: >
        Bewertung einer Antwort (US-03). Wird pseudonymisiert erfasst — die
        Tabelle `feedback` hält bewusst keinen Bezug zur Nutzerin.
      required: [helpful]
      properties:
        helpful:
          type: boolean
          description: 👍 = true, 👎 = false
        category:
          allOf:
            - $ref: '#/components/schemas/FeedbackCategory'
          nullable: true
        comment:
          type: string
          maxLength: 500
          nullable: true
          description: Optionale Freitext-Ergänzung

    ConfigResponse:
      type: object
      required: [config]
      properties:
        config:
          type: object
          description: Schlüssel-Wert-Paare aus der config-Tabelle; Werte immer als String
          additionalProperties:
            type: string

    ConfigUpdateRequest:
      type: object
      required: [config]
      properties:
        config:
          type: object
          additionalProperties:
            type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    DocumentStatus:
      type: string
      enum: [pending, processing, available, failed]

    DocumentUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Dokument (PDF, DOCX oder Markdown), max. 10 MB
        area:
          type: string
          description: Bereich; im MVP hartcodierter Pilot-Bereich
          default: default

    DocumentResponse:
      type: object
      required: [id, filename, status, area, chunk_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        status:
          $ref: '#/components/schemas/DocumentStatus'
        area:
          type: string
        chunk_count:
          type: integer
        error_message:
          type: string
          nullable: true
        created_at:
          description: Zeitpunkt des ersten Uploads; überlebt eine Ersetzung (T-15)
          type: string
          format: date-time
        updated_at:
          description: Zeitpunkt des Uploads der aktuellen Fassung (T-15)
          type: string
          format: date-time

    DocumentList:
      type: array
      items:
        $ref: '#/components/schemas/DocumentResponse'
