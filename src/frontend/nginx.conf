# TLS-Aktivierung (Ops/07, Punkt 1.6) — BEIDE Schritte gehoeren zusammen:
#   1. den Redirect-Block unten einkommentieren, UND
#   2. im Haupt-server-Block "listen 80" durch die dortigen listen/ssl_*-Zeilen ersetzen.
# Nur Schritt 1 ergibt zwei Default-Server auf Port 80; nginx behaelt den ersten,
# leitet alles nach https um und niemand lauscht dort -> Totalausfall. "nginx -t"
# meldet das lediglich als Warnung ("conflicting server name"), nicht als Fehler.
#
# server {
#     listen 80;
#     return 301 https://$host$request_uri;
# }

# Zugriffslog ohne Personenbezug (M8T1-Lab, Minimierung "weglassen").
#
# Der nginx-Default ist "combined", und der schreibt $remote_addr, $remote_user,
# $http_referer und $http_user_agent nach stdout — im Container also in
# "docker logs", unbegrenzt. Fuer den Zweck, den dieses Log hier hat (kam der
# Request an, mit welchem Status, wie langsam), wird nichts davon gebraucht:
# uebrig bleiben Zeit, Request, Status, Groesse und die Bearbeitungsdauer, die
# "combined" nicht einmal enthaelt — weniger Personenbezug UND mehr Nutzen.
#
# Nicht betroffen ist das Rate-Limiting: die API liest die Adresse zur Laufzeit
# aus X-Real-IP / X-Forwarded-For (app/limiter.py), die weiter unten
# unveraendert gesetzt werden. Diese Direktive bestimmt nur, was ins Log
# geschrieben wird, nicht was der Upstream sieht.
#
# Gilt im http-Kontext: diese Datei wird als conf.d/default.conf eingebunden.
log_format minimal '[$time_local] "$request" $status $body_bytes_sent rt=$request_time';

server {
    listen 80;
    # Schritt 2: die Zeile darueber loeschen und diese drei aktivieren.
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    access_log /var/log/nginx/access.log minimal;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Uncomment and tighten once HTTPS is active:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy /api/* → API Server (strips /api prefix)
    # Resolve "api" per request via Docker's embedded DNS (127.0.0.11) so a
    # restarted API container (new IP) is picked up automatically. With a
    # literal host, nginx resolves the upstream only once at startup and
    # returns 502 ("connection refused") after the API moves to a new IP.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx is the sole trusted edge (no upstream LB/CDN, and the "edge" Docker
        # network in docker-compose.yml only contains webapp and api — worker has no
        # route to api) — overwrite rather than append, so a client-supplied
        # X-Forwarded-For can't spoof the address the API's rate limiter keys on
        # (api runs with --forwarded-allow-ips='*').
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 11m;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
