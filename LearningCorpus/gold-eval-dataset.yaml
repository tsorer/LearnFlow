      locator: "Artikel 11 – Technische Dokumentation"
    version_sensitive: false
    notes: ""

  - id: AIA-KMU-01
    corpus: eu-ai-act
    category: in_corpus
    question: "Welche besonderen Regelungen gelten für kleine und mittlere Unternehmen (KMU) bei der Bereitstellung der technischen Dokumentation?"
    expected_refusal: false
    reference_answer: >-
      KMU, einschliesslich Start-up-Unternehmen, können die Elemente der technischen
      Dokumentation (Anhang IV) in vereinfachter Weise bereitstellen. Die Kommission
      erstellt ein vereinfachtes Formular, das auf die Bedürfnisse kleiner Unternehmen und
      Kleinstunternehmen zugeschnitten ist. Entscheidet sich ein KMU für diese vereinfachte
      Bereitstellung, muss es dieses Formular verwenden; notifizierte Stellen akzeptieren es
      für die Konformitätsbewertung.
    expected_source:
      pages: [58]
      locator: "Artikel 11 – Technische Dokumentation"
    version_sensitive: false
    notes: ""

