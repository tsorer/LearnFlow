    corpus: eu-ai-act
    category: in_corpus
    question: "Welche grundlegende technische Anforderung müssen Hochrisiko-KI-Systeme in Bezug auf die Aufzeichnung von Ereignissen erfüllen?"
    expected_refusal: false
    reference_answer: >-
