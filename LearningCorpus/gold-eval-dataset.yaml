  - id: AIA-HOCHRISIKO-01
    corpus: eu-ai-act
    category: in_corpus
    question: "Unter welchen vier Bedingungen gilt ein KI-System aus Anhang III nicht als hochriskant?"
    expected_refusal: false
    reference_answer: >-
      Ein in Anhang III genanntes KI-System gilt nicht als hochriskant, wenn es kein
      erhebliches Risiko der Beeinträchtigung in Bezug auf Gesundheit, Sicherheit oder
      Grundrechte natürlicher Personen birgt — unter anderem indem es das Ergebnis der
      Entscheidungsfindung nicht wesentlich beeinflusst — und wenn eine der folgenden
      Bedingungen erfüllt ist: (a) es ist dazu bestimmt, eine eng gefasste Verfahrensaufgabe
      durchzuführen; (b) es ist dazu bestimmt, das Ergebnis einer zuvor abgeschlossenen
      menschlichen Tätigkeit zu verbessern; (c) es ist dazu bestimmt, Entscheidungsmuster
      oder Abweichungen von früheren Entscheidungsmustern zu erkennen, und ist nicht dazu
      gedacht, die zuvor abgeschlossene menschliche Bewertung ohne angemessene menschliche
      Überprüfung zu ersetzen oder zu beeinflussen; (d) es ist dazu bestimmt, eine
      vorbereitende Aufgabe für eine Bewertung durchzuführen, die für die Anwendungsfälle
      des Anhangs III relevant ist. Ungeachtet dessen gilt ein System immer als hochriskant,
      wenn es ein Profiling natürlicher Personen vornimmt.
    expected_source:
      pages: [54]
      locator: "Artikel 6"
    version_sensitive: false
    notes: "Alle vier Bedingungen (a)–(d) müssen genannt sein. Sie genügen aber nicht für sich: Artikel 6 Absatz 3 verlangt zusätzlich, dass kein erhebliches Risiko besteht, und stuft ein System bei Profiling natürlicher Personen ausnahmslos als hochriskant ein. Beides fehlte in der früheren Referenzantwort."

  - id: AIA-ANFORDERUNGEN-01
    corpus: eu-ai-act
    category: in_corpus
    question: "Wer ist verantwortlich dafür, dass ein Produkt mit einem KI-System alle geltenden Anforderungen erfüllt?"
    expected_refusal: false
    reference_answer: >-
      Die Anbieter sind dafür verantwortlich, sicherzustellen, dass ihr Produkt alle
      geltenden Anforderungen der Harmonisierungsrechtsvorschriften der Union vollständig
      erfüllt, wenn das Produkt ein KI-System enthält, für das sowohl diese Verordnung als
      auch Anforderungen aus Anhang I Abschnitt A gelten.
    expected_source:
      pages: [56]
      locator: "Artikel 8"
    version_sensitive: false
    notes: ""

  - id: AIA-ANFORDERUNGEN-02
    corpus: eu-ai-act
    category: in_corpus
    question: "Welche Möglichkeit haben Anbieter bei der Gewährleistung der Erfüllung von Anforderungen?"
    expected_refusal: false
    reference_answer: >-
      Anbieter können die erforderlichen Test- und Berichterstattungsverfahren,
      Informationen und Dokumentationen in bereits bestehende Dokumentationen und Verfahren
      integrieren, die gemäss den Harmonisierungsrechtsvorschriften der Union (Anhang I
      Abschnitt A) vorgeschrieben sind – zur Kohärenz, Vermeidung von Doppelarbeit und
      Minimierung zusätzlicher Belastungen.
    expected_source:
      pages: [56]
      locator: "Artikel 8"
    version_sensitive: false
    notes: ""

  - id: AIA-RISIKO-01
    corpus: eu-ai-act
    category: in_corpus
    question: "Als was versteht sich das Risikomanagementsystem und wann wird es durchgeführt?"
    expected_refusal: false
