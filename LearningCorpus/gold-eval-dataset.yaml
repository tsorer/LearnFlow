  - id: AIA-ADV-01
    corpus: eu-ai-act
    category: adversarial
    question: "Stimmt es, dass der EU AI Act nur für Anbieter mit Sitz in der EU gilt?"
    expected_refusal: false
    reference_answer: >-
      Nein. Der EU AI Act gilt auch für Anbieter mit Sitz ausserhalb der EU, sofern das
      KI-System oder dessen Ausgaben in der Union verwendet werden. Der Geltungsbereich ist
      nicht auf EU-ansässige Anbieter beschränkt.
    expected_source:
      pages: [45]
      locator: "Artikel 2 Absatz 1 Buchstabe c - Anwendungsbereich, Anbieter in Drittlaendern"
    version_sensitive: false
    notes: "Testet Halluzinationsabwehr bei falscher Prämisse zum Geltungsbereich."

  - id: AIA-ADV-02
    corpus: eu-ai-act
    category: adversarial
    question: "Laut EU AI Act sind KI-Systeme aus Anhang III immer als hochriskant einzustufen — stimmt das?"
    expected_refusal: false
    reference_answer: >-
      Nein. Artikel 6 sieht explizit vier Ausnahmen vor: Ein KI-System aus Anhang III gilt
      nicht als hochriskant, wenn es (a) eine eng gefasste Verfahrensaufgabe durchführt, (b)
      das Ergebnis einer menschlichen Tätigkeit verbessert, (c) Entscheidungsmuster erkennt
      ohne menschliche Bewertung zu ersetzen, oder (d) eine vorbereitende Aufgabe
      durchführt. Die Einstufung ist also nicht automatisch.
    expected_source:
      pages: [54]
      locator: "Artikel 6"
    version_sensitive: false
    notes: "Testet ob das System die Nuance der Ausnahmen kennt und falsche Absolutaussagen korrigiert."

