  - id: SKOS-ADV-01
    corpus: skos-richtlinien
    category: adversarial
    question: "Mein Kanton zahlt einen anderen Grundbedarf als die SKOS-Empfehlung — welcher Betrag gilt?"
    expected_refusal: false
    reference_answer: >-
      Die SKOS-Richtlinien sind Empfehlungen; rechtlich massgebend ist das kantonale Recht.
      Ist der kantonsspezifische Betrag nicht im Korpus enthalten, soll das System darauf
      hinweisen bzw. "Weiss ich nicht" sagen, statt einen Betrag zu erfinden.
    expected_source:
      pages: null
      locator: "Allgemeiner Teil / Geltungsbereich (Empfehlungscharakter)"
    version_sensitive: false
    notes: "Testet Nuance (Empfehlung vs. kantonale Verbindlichkeit) und Halluzinationsabwehr."

