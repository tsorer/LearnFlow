  - id: SKOS-ALI-01
    corpus: skos-richtlinien
    category: in_corpus
    question: "Muss eine Person Alimente bzw. die Alimentenbevorschussung beanspruchen, bevor Sozialhilfe ausgerichtet wird?"
    expected_refusal: false
    reference_answer: >-
      Ja. Es besteht kein Wahlrecht zwischen vorrangigen Hilfsquellen und der Sozialhilfe;
      zur Pflicht, die Bedürftigkeit zu mindern, gehört ausdrücklich, Ansprüche auf
      (Ersatz-)Einkommen geltend zu machen — genannt werden unter anderem Alimente.
      Familienrechtliche Unterhaltsbeiträge und Beiträge der Alimentenbevorschussung zählen
      zu den anrechenbaren Einnahmen. Bei der Geltendmachung bzw. Durchsetzung solcher
      Ansprüche kann die betroffene Person beraterisch und rechtlich unterstützt werden.
    expected_source:
      pages: [6, 7, 14, 83]
      locator: "Allgemeiner Teil / A.3 Rz 2 und Erläuterung a · A.4.1 Erläuterung d · Leistungsbemessung / D.1 Erläuterung a"
    version_sensitive: false
    notes: "Prinzip, nicht Betragshöhe. Präzisiert: die Richtlinien sprechen von Unterstützung der Person bei der Durchsetzung, nicht davon, dass die Sozialbehörde die Forderung selbst durchsetzt."

  - id: SKOS-EL-01
    corpus: skos-richtlinien
    category: in_corpus
    question: "Gehen Ergänzungsleistungen zur AHV/IV der Sozialhilfe vor?"
    expected_refusal: false
    reference_answer: >-
      Ja. Es besteht kein Wahlrecht zwischen vorrangigen Hilfsquellen und der Sozialhilfe.
      Ergänzungsleistungen und Beihilfen zählen — wie Renten der AHV/IV/UV — zu den
      verfügbaren Einnahmen und werden bei der Bemessung angerechnet; decken Rente und
      anrechenbarer Vermögensverzehr den Lebensunterhalt nicht, können Ergänzungs-
      leistungen beantragt werden. Das sozialhilferechtliche Existenzminimum liegt
      ausdrücklich unter demjenigen der Ergänzungsleistungen.
    expected_source:
      pages: [6, 83, 97]
      locator: "Leistungsbemessung / D.1 Erläuterung a · D.3.3 Altersvorsorge · Allgemeiner Teil / A.3 Rz 2"
    version_sensitive: false
    notes: "Der Vorrang ergibt sich in den Richtlinien indirekt — über die Anrechnung als Einnahme (D.1) und das Subsidiaritätsprinzip (A.3), nicht über eine eigene Bestimmung zu vorrangigen Leistungen."

