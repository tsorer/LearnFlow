      kontrastierender Fälle keine neuen theoretischen Erkenntnisse mehr generiert werden
      können und die Heterogenität des Feldes umfassend abgebildet ist.
    expected_source:
      pages: [113]
      locator: "Kapitel 14.1 – Methodisches Vorgehen"
    version_sensitive: false
    notes: ""

  - id: SAMW-QUALI-ERHEBUNG-01
    corpus: samw-leitfaden
