      bringt oder das KI-System unter ihrem eigenen Namen oder ihrer Handelsmarke in Betrieb
      nimmt, sei es entgeltlich oder unentgeltlich.
    expected_source:
      pages: [46]
      locator: "Artikel 3 Nummer 3 - Begriffsbestimmung \"Anbieter\""
    version_sensitive: false
    notes: "Kerndefinition; keine Betragsangaben."

