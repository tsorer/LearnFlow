    question: "Welche Möglichkeit haben Anbieter bei der Gewährleistung der Erfüllung von Anforderungen?"
    expected_refusal: false
    reference_answer: >-
      Anbieter können die erforderlichen Test- und Berichterstattungsverfahren,
      Informationen und Dokumentationen in bereits bestehende Dokumentationen und Verfahren
      integrieren, die gemäss den Harmonisierungsrechtsvorschriften der Union (Anhang I
      Abschnitt A) vorgeschrieben sind – zur Kohärenz, Vermeidung von Doppelarbeit und
      Minimierung zusätzlicher Belastungen.
    expected_source:
      pages: [56]
      locator: "Artikel 8"
    version_sensitive: false
    notes: ""

  - id: AIA-RISIKO-01
    corpus: eu-ai-act
    category: in_corpus
    question: "Als was versteht sich das Risikomanagementsystem und wann wird es durchgeführt?"
    expected_refusal: false
    reference_answer: >-
      Das Risikomanagementsystem versteht sich als ein kontinuierlicher iterativer Prozess,
      der während des gesamten Lebenszyklus eines Hochrisiko-KI-Systems geplant und
      durchgeführt wird und eine regelmässige systematische Überprüfung und Aktualisierung
      erfordert.
    expected_source:
      pages: [56]
      locator: "Artikel 9 – Risikomanagementsystem"
    version_sensitive: false
    notes: ""

  - id: AIA-BIAS-01
    corpus: eu-ai-act
    category: in_corpus
    question: "Worauf muss die Untersuchung auf mögliche Verzerrungen (Bias) bei der Daten-Governance von Hochrisiko-KI-Systemen insbesondere überprüft werden?"
    expected_refusal: false
    reference_answer: >-
      Die Untersuchung muss als Teil der Daten-Governance insbesondere überprüfen, ob
      Verzerrungen die Gesundheit und Sicherheit von Personen beeinträchtigen, sich negativ
      auf die Grundrechte auswirken oder zu einer nach dem Unionsrecht verbotenen
      Diskriminierung führen könnten. Dies ist besonders relevant, wenn Datenausgaben als
      Eingaben für künftige Operationen dienen, da sich Verzerrungen dadurch verstärken und
      kumulativ auswirken können.
    expected_source:
      pages: [57]
      locator: "Artikel 10 – Daten und Daten-Governance"
    version_sensitive: false
    notes: ""

  - id: AIA-DOKUMENT-01
    corpus: eu-ai-act
    category: in_corpus
    question: "Wann muss die technische Dokumentation eines Hochrisiko-KI-Systems erstellt werden?"
    expected_refusal: false
    reference_answer: >-
      Die technische Dokumentation muss vor dem Inverkehrbringen oder der Inbetriebnahme des
      Systems erstellt werden und ist danach auf dem neuesten Stand zu halten — sie muss
      also kontinuierlich aktualisiert werden.
    expected_source:
      pages: [58]
      locator: "Artikel 11 – Technische Dokumentation"
    version_sensitive: false
    notes: ""

  - id: AIA-KMU-01
    corpus: eu-ai-act
    category: in_corpus
    question: "Welche besonderen Regelungen gelten für kleine und mittlere Unternehmen (KMU) bei der Bereitstellung der technischen Dokumentation?"
    expected_refusal: false
    reference_answer: >-
      KMU, einschliesslich Start-up-Unternehmen, können die Elemente der technischen
      Dokumentation (Anhang IV) in vereinfachter Weise bereitstellen. Die Kommission
      erstellt ein vereinfachtes Formular, das auf die Bedürfnisse kleiner Unternehmen und
      Kleinstunternehmen zugeschnitten ist. Entscheidet sich ein KMU für diese vereinfachte
      Bereitstellung, muss es dieses Formular verwenden; notifizierte Stellen akzeptieren es
      für die Konformitätsbewertung.
    expected_source:
      pages: [58]
      locator: "Artikel 11 – Technische Dokumentation"
    version_sensitive: false
    notes: ""

  - id: AIA-PROTOKOLL-01
    corpus: eu-ai-act
    category: in_corpus
    question: "Welche grundlegende technische Anforderung müssen Hochrisiko-KI-Systeme in Bezug auf die Aufzeichnung von Ereignissen erfüllen?"
    expected_refusal: false
    reference_answer: >-
      Die Technik der Hochrisiko-KI-Systeme muss die automatische Aufzeichnung von
      Ereignissen (Protokollierung) während des gesamten Lebenszyklus des Systems
      ermöglichen.
    expected_source:
      pages: [59]
      locator: "Artikel 12 – Aufzeichnungspflichten"
    version_sensitive: false
    notes: ""

  - id: AIA-PROTOKOLL-02
    corpus: eu-ai-act
    category: in_corpus
    question: "Welches übergeordnete Ziel verfolgen die Protokollierungsfunktionen bei Hochrisiko-KI-Systemen?"
    expected_refusal: false
    reference_answer: >-
      Die Protokollierungsfunktionen dienen der Gewährleistung, dass das Funktionieren des
      Hochrisiko-KI-Systems in einem der Zweckbestimmung angemessenen Masse rückverfolgbar
      ist — sie ermöglichen Nachverfolgbarkeit und Transparenz des Systemverhaltens
      entsprechend der vorgesehenen Verwendung.
    expected_source:
      pages: [59]
      locator: "Artikel 12 – Aufzeichnungspflichten"
    version_sensitive: false
    notes: ""

  - id: AIA-PROTOKOLL-03
    corpus: eu-ai-act
    category: in_corpus
    question: "Auf welche drei konkreten Zwecke hin müssen Protokollierungsfunktionen Ereignisse aufzeichnen?"
    expected_refusal: false
    reference_answer: >-
      Die Protokollierungsfunktionen müssen Ereignisse aufzeichnen, die relevant sind für:
      (a) die Ermittlung von Situationen, die dazu führen können, dass das System ein Risiko
      im Sinne von Artikel 79 Absatz 1 birgt oder dass es zu einer wesentlichen Änderung
      kommt; (b) die Erleichterung der Beobachtung nach dem Inverkehrbringen gemäss Artikel
      72; (c) die Überwachung des Betriebs der Hochrisiko-KI-Systeme gemäss Artikel 26
      Absatz 5.
    expected_source:
      pages: [59]
      locator: "Artikel 12 – Aufzeichnungspflichten"
    version_sensitive: false
    notes: "Alle drei Zwecke (a)–(c) müssen genannt sein."

  - id: AIA-TRANSPARENZ-01
    corpus: eu-ai-act
    category: in_corpus
    question: "Welche Anforderung an die Transparenz von Hochrisiko-KI-Systemen muss bei deren Konzeption und Entwicklung erfüllt werden, und zu welchem Zweck?"
    expected_refusal: false
    reference_answer: >-
      Hochrisiko-KI-Systeme müssen so konzipiert und entwickelt werden, dass ihr Betrieb
      hinreichend transparent ist, damit die Betreiber die Ausgaben angemessen
      interpretieren und verwenden können. Die Transparenz wird auf eine geeignete Art und
      in einem angemessenen Masse gewährleistet, damit Anbieter und Betreiber ihre in
      Abschnitt 3 festgelegten Pflichten erfüllen können.
    expected_source:
      pages: [59]
      locator: "Artikel 13 – Transparenz und Bereitstellung von Informationen"
    version_sensitive: false
    notes: ""

