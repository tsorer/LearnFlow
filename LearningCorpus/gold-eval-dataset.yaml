  - id: AIA-HOCHRISIKO-01
    corpus: eu-ai-act
    category: in_corpus
    question: "Unter welchen vier Bedingungen gilt ein KI-System aus Anhang III nicht als hochriskant?"
    expected_refusal: false
    reference_answer: >-
      Ein KI-System aus Anhang III gilt nicht als hochriskant, wenn eine der folgenden
      Bedingungen erfüllt ist: (a) Es ist dazu bestimmt, eine eng gefasste Verfahrensaufgabe
      durchzuführen; (b) Es ist dazu bestimmt, das Ergebnis einer zuvor abgeschlossenen
      menschlichen Tätigkeit zu verbessern; (c) Es ist dazu bestimmt, Entscheidungsmuster zu
      erkennen, und ist nicht dazu gedacht, die menschliche Bewertung ohne angemessene
      menschliche Überprüfung zu ersetzen oder zu beeinflussen; (d) Es ist dazu bestimmt,
      eine vorbereitende Aufgabe für eine Bewertung durchzuführen, die für die in Anhang III
      aufgeführten Anwendungsfälle relevant ist.
    expected_source:
      pages: [54]
      locator: "Artikel 6"
    version_sensitive: false
    notes: "Alle vier Bedingungen (a)–(d) müssen genannt sein."

