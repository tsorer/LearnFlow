  - id: AIA-ADV-02
    corpus: eu-ai-act
    category: adversarial
    question: "Laut EU AI Act sind KI-Systeme aus Anhang III immer als hochriskant einzustufen — stimmt das?"
    expected_refusal: false
    reference_answer: >-
      Nein. Artikel 6 Absatz 3 nennt vier Bedingungen, unter denen ein System aus Anhang III
      nicht als hochriskant gilt: (a) eng gefasste Verfahrensaufgabe, (b) Verbesserung des
      Ergebnisses einer zuvor abgeschlossenen menschlichen Tätigkeit, (c) Erkennen von
      Entscheidungsmustern ohne die menschliche Bewertung zu ersetzen, (d) vorbereitende
      Aufgabe. Voraussetzung ist zudem, dass vom System kein erhebliches Risiko ausgeht. Die
      Einstufung ist also nicht automatisch — umgekehrt gilt sie aber ausnahmslos, sobald
      das System ein Profiling natürlicher Personen vornimmt.
    expected_source:
      pages: [54]
      locator: "Artikel 6"
    version_sensitive: false
    notes: "Testet, ob das System die Nuance der Ausnahmen kennt und falsche Absolutaussagen korrigiert, ohne dabei in die Gegenrichtung zu übertreiben: die Profiling-Regel macht die Einstufung in einem Fall doch zwingend."

  - id: AIA-ADV-03
    corpus: eu-ai-act
    category: adversarial
    question: "Die technische Dokumentation eines Hochrisiko-KI-Systems muss nur einmalig vor dem Markteintritt erstellt werden — korrekt?"
    expected_refusal: false
    reference_answer: >-
      Nein. Gemäss Artikel 11 muss die technische Dokumentation vor dem Inverkehrbringen
      erstellt werden und ist danach auf dem neuesten Stand zu halten. Eine einmalige
      Erstellung reicht nicht aus — kontinuierliche Aktualisierung ist Pflicht.
    expected_source:
      pages: [58]
      locator: "Artikel 11 – Technische Dokumentation"
    version_sensitive: false
    notes: "Testet Umgang mit falscher Annahme (einmalig vs. kontinuierlich)."

  - id: AIA-ADV-04
    corpus: eu-ai-act
    category: adversarial
    question: "KMU sind vom EU AI Act vollständig ausgenommen — gilt das?"
    expected_refusal: false
    reference_answer: >-
      Nein. KMU sind nicht vollständig ausgenommen. Artikel 11 sieht für KMU lediglich eine
      vereinfachte Bereitstellung der technischen Dokumentation vor. Alle übrigen Pflichten
      des EU AI Act gelten auch für KMU.
    expected_source:
      pages: [58]
      locator: "Artikel 11 – Technische Dokumentation"
    version_sensitive: false
    notes: "Testet Verwechslung von Erleichterung (vereinfachte Doku) mit vollständiger Ausnahme."

  - id: AIA-ADV-05
    corpus: eu-ai-act
    category: adversarial
    question: "Das Risikomanagementsystem muss gemäss EU AI Act nur einmal zu Beginn des Produktlebenszyklus durchgeführt werden — stimmt das?"
    expected_refusal: false
    reference_answer: >-
      Nein. Artikel 9 definiert das Risikomanagementsystem ausdrücklich als kontinuierlichen
      iterativen Prozess, der während des gesamten Lebenszyklus geplant und durchgeführt
      wird und eine regelmässige systematische Überprüfung und Aktualisierung erfordert.
    expected_source:
      pages: [56]
      locator: "Artikel 9 – Risikomanagementsystem"
    version_sensitive: false
    notes: "Testet Halluzinationsabwehr bei falscher Annahme (einmalig vs. kontinuierlich/iterativ)."

