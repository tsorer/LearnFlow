  - id: SAMW-HFG-INKRAFT-01
    corpus: samw-leitfaden
    category: in_corpus
    question: "Wann ist das Humanforschungsgesetz (HFG) in Kraft getreten und welche drei Ausführungsverordnungen konkretisieren es?"
    expected_refusal: false
    reference_answer: >-
      Das HFG ist Anfang 2014 in Kraft getreten, zusammen mit drei ausführenden
      Verordnungen: der Verordnung über klinische Versuche (KlinV), der
      Humanforschungsverordnung (HFV) und der Organisationsverordnung HFG (OV-HFG).
    expected_source:
      pages: [24]
      locator: "Kapitel 3.2 – Schweiz"
    version_sensitive: false
    notes: "Alle drei Verordnungen müssen genannt sein."

  - id: SAMW-HFG-ZIELE-01
    corpus: samw-leitfaden
    category: in_corpus
    question: "Welche drei Ziele verfolgt der Gesetzgeber mit dem HFG?"
    expected_refusal: false
    reference_answer: >-
      (a) Schutz von Würde, Persönlichkeit und Gesundheit der in die Forschung einbezogenen
      Personen; (b) Schaffung günstiger Rahmenbedingungen für die Forschung; (c)
      Gewährleistung von Qualität und Transparenz der Forschung mit Menschen.
    expected_source:
      pages: [25]
      locator: "Kapitel 3.3 – HFG: Zweck und Geltungsbereich"
    version_sensitive: false
    notes: "Alle drei Ziele (a)–(c) müssen genannt sein."

  - id: SAMW-RISIKOKAT-01
    corpus: samw-leitfaden
    category: in_corpus
    question: "In welche Risikokategorien werden Forschungsvorhaben nach HFG eingeteilt, und welche weist das geringste Risiko auf?"
    expected_refusal: false
    reference_answer: >-
      Klinische Versuche bzw. Forschungsvorhaben mit Personen werden in die Kategorien A, B
      und C unterteilt, wobei A das geringste und C das höchste Risikopotential aufweist.
      Eine Kategorisierung ist nur bei Forschungsprojekten mit Personen vorgesehen (nicht z.
      B. bei bereits vorhandenem biologischem Material).
    expected_source:
      pages: [57]
      locator: "Kapitel 6.4 – Risikokategorisierung nach HFG"
    version_sensitive: true
    notes: "Kategorisierungssystem nach HFG/KlinV — gegen aktuelle Rechtslage prüfen."

  - id: SAMW-SUBSIDIARITAET-01
    corpus: samw-leitfaden
    category: in_corpus
    question: "Was besagt das „Prinzip der Subsidiarität” bei Forschung mit besonders vulnerablen Personen?"
    expected_refusal: false
    reference_answer: >-
      Besonders vulnerable Personen dürfen nur dann in ein Forschungsprojekt einbezogen
      werden, wenn gleichwertige Erkenntnisse anders nicht gewonnen werden können (Art. 11
      Abs. 2 HFG). Es soll verhindern, dass die Verletzlichkeit einer Gruppe ausgenutzt
      wird, um sie einfacher einzubeziehen.
    expected_source:
      pages: [40]
      locator: "Kapitel 5.1 – Konzept der Vulnerabilität"
    version_sensitive: false
    notes: "Bezug Art. 11 Abs. 2 HFG."

