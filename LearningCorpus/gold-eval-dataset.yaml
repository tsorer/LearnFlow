      2025/2026).
    expected_source:
      pages: null
      locator: "Grundbedarf / Merkblatt Teuerung"
    version_sensitive: true
    notes: "Testet Umgang mit veralteter Annahme (2021 vs. 2026) — System soll korrigieren, nicht bestätigen."

