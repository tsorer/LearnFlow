questions:
  - id: SKOS-GBL-01
    corpus: skos-richtlinien
    category: in_corpus
    question: "Was umfasst der Grundbedarf für den Lebensunterhalt (GBL)?"
    expected_refusal: false
    reference_answer: >-
      Neun Ausgabenpositionen: a) Nahrungsmittel, Getränke und Tabakwaren; b) Bekleidung und
      Schuhe; c) Energieverbrauch (ohne Wohnnebenkosten); d) allgemeine Haushaltsführung; e)
      persönliche Pflege; f) Verkehrsauslagen (örtlicher Nahverkehr); g)
      Nachrichtenübermittlung, Internet, Radio/TV; h) Bildung, Freizeit, Sport,
      Unterhaltung; i) Übriges (finanzielle Dienstleistungen, Geschenke und Einladungen).
      Der GBL wird als Pauschale ausbezahlt — unterstützte Personen teilen den Betrag selbst
      ein und sind nicht an die Gewichtung des Warenkorbs gebunden (Dispositionsfreiheit).
    expected_source:
      pages: [40, 41]
      locator: "Materielle Grundsicherung / C.3.1 Grundbedarf im Allgemeinen (Rz 1 und Erläuterung a)"
    version_sensitive: false
    notes: "Zusammensetzung; keine Beträge (die stehen nicht im Korpus, siehe SKOS-GBL-02). Prüfkriterium ist die Vollständigkeit der neun Positionen."

  - id: SKOS-GBL-02
    corpus: skos-richtlinien
    category: out_of_corpus
    question: "Wie hoch ist der Grundbedarf für einen 1-Personen-Haushalt pro Monat?"
    expected_refusal: true
    reference_answer: null
    expected_source: null
    version_sensitive: false
    notes: "Die Höhe des GBL wird kantonal festgelegt und ist nicht im SKOS-Korpus enthalten → Weiss ich nicht."

  - id: SKOS-PRINZ-01
    corpus: skos-richtlinien
    category: in_corpus
    question: "Auf welchen Prinzipien beruht die Sozialhilfe gemäss den SKOS-Richtlinien?"
    expected_refusal: false
    reference_answer: >-
      Acht Prinzipien (A.3, Randziffern 1–9): 1. Menschenwürde — jede Person darf um ihres
      Menschseins willen vom Gemeinwesen Existenzsicherung verlangen und darf nicht zum
      Objekt staatlichen Handelns werden. 2. Subsidiarität — Anspruch besteht, wenn
      Selbsthilfe und rechtzeitige Hilfe Dritter fehlen; kein Wahlrecht zwischen vorrangigen
      Hilfsquellen und der Sozialhilfe. 3. Individualisierung — Hilfe wird dem Einzelfall
      angepasst; keine materielle Besserstellung gegenüber Personen in bescheidenen
      wirtschaftlichen Verhältnissen. 4. Bedarfsdeckung — behoben wird eine aktuelle
      Notlage. 5. Ursachenunabhängigkeit — Finalprinzip; Leistungen dürfen nicht von den
      Ursachen der Notlage abhängig gemacht werden. 6. Leistung und Gegenleistung —
      Integrationsmassnahmen beruhen darauf; Erwerbstätigkeit wird mit EFB, andere
      Integrationsbemühungen mit IZU honoriert. 7. Professionalität und Qualität —
      professionelle Beratung und Begleitung; fachspezifische Kompetenzen und genügend
      Ressourcen. 8. Koordination mit Dritten — Verbundaufgabe, koordiniert mit anderen
      Leistungszweigen des Sozialsystems und unter Einbindung privater Strukturen.
    expected_source:
      pages: [6, 7]
      locator: "Allgemeiner Teil / A.3 Prinzipien der Sozialhilfe"
    version_sensitive: false
    notes: "Prüfkriterium ist Vollständigkeit — alle acht Prinzipien müssen genannt sein. Achtung: acht Prinzipien auf neun Randziffern verteilt (Ziff. 6 und 7 gehören beide zu Leistung und Gegenleistung)."

  - id: SKOS-PRINZ-02
    corpus: skos-richtlinien
    category: in_corpus
    question: "Was bedeutet das Bedarfsdeckungsprinzip?"
    expected_refusal: false
    reference_answer: >-
      Mit Sozialhilfe wird ein aktueller Bedarf gedeckt bzw. eine aktuelle Notlage behoben.
      „Aktuell“ heisst: Leistungen für die Gegenwart und — solange die Notlage anhält — für
      die Zukunft, nicht jedoch für die Vergangenheit; grundsätzlich besteht kein Anspruch
      auf Übernahme von Schulden. Massgebend ist das sozialhilferechtliche Existenzminimum.
      Unterstützte Personen sollen materiell nicht bessergestellt werden als Personen, die
      in bescheidenen wirtschaftlichen Verhältnissen leben, aber keinen
      Unterstützungsanspruch haben.
    expected_source:
      pages: [6, 8]
      locator: "Allgemeiner Teil / A.3 Prinzipien der Sozialhilfe (Bedarfsdeckung, Rz 4 und Erläuterung c)"
    version_sensitive: false
    notes: "Vertiefung zu SKOS-PRINZ-01. Früher enthielt die Referenzantwort den Zusatz „keine bedarfsunabhängige Pauschale“ — das steht so nicht im Korpus (die Leistungen sind im Gegenteil weitgehend pauschalisiert, A.3 Erl. b) und wurde entfernt."

  - id: SKOS-PRINZ-03
    corpus: skos-richtlinien
    category: in_corpus
    question: "Was besagt das Subsidiaritätsprinzip in der Sozialhilfe?"
    expected_refusal: false
    reference_answer: >-
      Ein Anspruch auf Sozialhilfe besteht, wenn eine Person sich nicht selbst helfen kann
      und auch von Dritten keine oder nicht rechtzeitig Hilfe erhält. Es besteht kein
      Wahlrecht zwischen vorrangigen Hilfsquellen und der Sozialhilfe. Jede Person hat alles
      Zumutbare zu unternehmen, um eine Notlage aus eigenen Kräften zu beheben — namentlich
      Einkommen, Vermögen, freiwillige Zuwendungen und die eigene Arbeitskraft zu verwerten
      sowie Ansprüche gegenüber Dritten geltend zu machen. Bei der Geltendmachung bzw.
      Durchsetzung solcher Ansprüche, namentlich gegenüber Sozialversicherungen, kann die
      betroffene Person beraterisch und rechtlich unterstützt werden.
    expected_source:
      pages: [6, 7]
      locator: "Allgemeiner Teil / A.3 Prinzipien der Sozialhilfe (Subsidiarität, Rz 2 und Erläuterung a)"
    version_sensitive: false
    notes: "Vertiefung zu SKOS-PRINZ-01; fachlicher Anker für SKOS-ALI-01, SKOS-EL-01, SKOS-IPV-01 und SKOS-ADV-EL-01."

  - id: SKOS-IZU-01
    corpus: skos-richtlinien
    category: in_corpus
    question: "Wofür wird eine Integrationszulage (IZU) ausgerichtet?"
    expected_refusal: false
    reference_answer: >-
      Mit der IZU werden Leistungen — ausschliesslich — nicht erwerbstätiger Personen für
      ihre soziale und/oder berufliche Integration finanziell anerkannt (Erwerbstätige
      erhalten stattdessen einen EFB, D.2). Anerkannt werden Leistungen, welche die
      Integrationschancen erhöhen oder erhalten; sie müssen überprüfbar sein und eine
      individuelle Anstrengung voraussetzen. Die IZU beträgt je nach Leistung und deren
      Bedeutung 100 bis 300 Franken pro Person und Monat; sie ist personenbezogen und kann
      mehreren Personen im selben Haushalt gewährt werden.
    expected_source:
      pages: [75]
      locator: "Materielle Grundsicherung / C.6.7 Integrationszulage für Nichterwerbstätige (IZU)"
    version_sensitive: false
    notes: ""

  - id: SKOS-EFB-01
    corpus: skos-richtlinien
    category: in_corpus
    question: "Was ist der Einkommensfreibetrag (EFB) bei Erwerbstätigkeit?"
    expected_refusal: false
    reference_answer: >-
      Ein Freibetrag auf Erwerbseinkommen aus dem ersten Arbeitsmarkt, der nicht an die
      Unterstützung angerechnet wird — als Anreiz zur Erwerbsaufnahme bzw. zur Erhöhung des
      Arbeitspensums. Voraussetzung ist eine erbrachte Arbeitsleistung; Ausnahmen können
      vorgesehen werden. Der Freibetrag beträgt 400 bis 700 Franken pro Monat für eine
      Vollanstellung; die Obergrenze der kumulierten IZU und EFB liegt bei 850 Franken pro
      Monat und Unterstützungseinheit.
    expected_source:
      pages: [88]
      locator: "Leistungsbemessung / D.2 Einkommensfreibetrag (EFB)"
    version_sensitive: true
    notes: "Bandbreite und Obergrenze stehen im Korpus (D.2 Rz 3 und 4), sind aber versionsabhängig. Abgrenzung zur IZU (C.6.7) ist Teil des Prüfkriteriums: kein EFB auf Ersatzeinkommen, Praktika und Integrationsprogramme gelten nicht als Erwerbstätigkeit."

  - id: SKOS-SIL-01
    corpus: skos-richtlinien
    category: in_corpus
    question: "Welche Auslagen zählen zu den situationsbedingten Leistungen (SIL)?"
    expected_refusal: false
    reference_answer: >-
      SIL berücksichtigen die besondere gesundheitliche, wirtschaftliche, persönliche und
      familiäre Lage. Unterschieden werden zwei Arten: grundversorgende SIL — Kosten, die
      nur in bestimmten Situationen anfallen, dann aber übernommen werden müssen, weil sie
      Teil der materiellen Grundsicherung sind (typisch: krankheits- oder
      behinderungsbedingte Auslagen, Kinderbetreuungskosten, Erwerbsunkosten); und fördernde
      SIL — Kosten, deren Übernahme sinnvoll, aber nicht zwingend ist und die übernommen
      werden können, wenn sie den Zielen der Sozialhilfe dienen. Grundsätzlich werden die
      anerkannten und belegten Kosten übernommen.
    expected_source:
      pages: [59, 60]
      locator: "Materielle Grundsicherung / C.6.1 Situationsbedingte Leistungen — Grundsätze (Rz 1–3)"
    version_sensitive: false
    notes: "Prüfkriterium ist die Unterscheidung grundversorgende vs. fördernde SIL — eine reine Beispielliste greift zu kurz."

  - id: SKOS-WOHN-01
    corpus: skos-richtlinien
    category: in_corpus
    question: "Wie werden Wohnkosten in der Sozialhilfe berücksichtigt?"
    expected_refusal: false
    reference_answer: >-
      Grundsatz ist günstiges Wohnen. Angerechnet werden die Wohnkosten nach den örtlichen
      Verhältnissen inklusive der mietrechtlich anerkannten Nebenkosten (Akontobeiträge wie
      Nachzahlungen). Überhöhte Wohnkosten sind so lange zu übernehmen, bis eine zumutbare
      günstigere Lösung zur Verfügung steht; vor einem verlangten Umzug ist der Einzelfall
      zu prüfen (Grösse und Zusammensetzung der Familie, Verwurzelung, Alter und Gesundheit,
      soziale Integration). Wird die Wohnungssuche oder der zumutbare Umzug verweigert,
      entfällt der Anspruch auf den überhöhten Teil. Empfohlen werden nach Haushaltgrösse
      abgestufte, fachlich begründete Obergrenzen (Mietzinsrichtlinien); deren konkrete
      Beträge sind regional/kommunal und nicht im Korpus.
    expected_source:
      pages: [49, 50]
      locator: "Materielle Grundsicherung / C.4.1 Wohn- und Nebenkosten im Allgemeinen (Rz 1–6, Erläuterungen a–c)"
    version_sensitive: false
    notes: "Kern ist die Regel zu überhöhten Wohnkosten. Konkrete Mietzinsmaxima sind regional/kommunal — dazu darf das System keine Zahl nennen."

  - id: SKOS-SANK-01
    corpus: skos-richtlinien
    category: in_corpus
    question: "Unter welchen Voraussetzungen darf die Sozialhilfe gekürzt werden?"
    expected_refusal: false
    reference_answer: >-
      Werden Auflagen nicht befolgt oder gesetzliche Pflichten verletzt, ist eine
      verhältnismässige Leistungskürzung zu prüfen. Gekürzt werden können der GBL um 5 bis
      30 %, die Zulagen für Leistungen (EFB und IZU) sowie fördernde SIL. Die Kürzung ist
      auf höchstens 12 Monate zu befristen, ab 20 % auf höchstens 6 Monate; die maximale
      Kürzung von 30 % ist nur bei wiederholtem oder schwerwiegendem Fehlverhalten zulässig.
      Vorausgesetzt ist, dass das Fehlverhalten eine Kürzung rechtfertigt, der Person das
      erwartete Verhalten und die Folgen bekannt waren und sie sich äussern konnte. Der
      Bedarf von Kindern und Jugendlichen ist grundsätzlich von der Kürzung auszunehmen.
      Fallen Sanktion und Verrechnung zusammen, darf der Rahmen von 30 % des GBL insgesamt
      nicht überschritten werden.
    expected_source:
      pages: [142, 143, 144]
      locator: "Auflagen, Sanktionen, Ablehnung und Einstellung / F.2 Sanktionen (Rz 1–6, Erläuterungen a–d)"
    version_sensitive: true
    notes: "Prozentsätze und Fristen sind fassungsabhängig — gegen die gewählte Fassung prüfen. Früher stand hier „unter Wahrung des Existenzminimums“; die Richtlinien formulieren es umgekehrt (die Sozialhilfe darf nur befristet und begründet um einen Prozentsatz unterschritten werden)."

