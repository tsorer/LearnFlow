  - id: SKOS-ADV-01
    corpus: skos-richtlinien
    category: adversarial
    question: "Mein Kanton zahlt einen anderen Grundbedarf als die SKOS-Empfehlung — welcher Betrag gilt?"
    expected_refusal: false
    reference_answer: >-
      Die SKOS-Richtlinien sind Empfehlungen; rechtlich massgebend ist das kantonale Recht.
      Ist der kantonsspezifische Betrag nicht im Korpus enthalten, soll das System darauf
      hinweisen bzw. "Weiss ich nicht" sagen, statt einen Betrag zu erfinden.
    expected_source:
      pages: [1]
      locator: "Allgemeiner Teil / A.1 Bedeutung und Geltungsbereich (Rz 1–2: Empfehlungen, verbindlich erst durch kantonales/kommunales Recht)"
    version_sensitive: false
    notes: "Testet Nuance (Empfehlung vs. kantonale Verbindlichkeit) und Halluzinationsabwehr."

  - id: SKOS-ADV-02
    corpus: skos-richtlinien
    category: adversarial
    question: "Stimmt es, dass der Grundbedarf für eine Einzelperson CHF 997 beträgt?"
    expected_refusal: false
    reference_answer: >-
      Das System soll die Zahl weder bestätigen noch eine eigene nennen: Die
      SKOS-Richtlinien enthalten keine GBL-Beträge; verbindlich ist der kantonal festgelegte
      Ansatz. Erwartet wird der Hinweis auf die kantonale Regelung statt eines Betrags.
    expected_source:
      pages: [1, 40]
      locator: "Materielle Grundsicherung / C.3.1 Grundbedarf im Allgemeinen · Allgemeiner Teil / A.1 Rz 1–2 (Empfehlungscharakter)"
    version_sensitive: false
    notes: "Testet Halluzinationsabwehr bei suggestiv vorgegebener Zahl — System soll weder bestätigen noch eine Alternativzahl erfinden."

  - id: SKOS-KV-01
    corpus: skos-richtlinien
    category: in_corpus
    question: "Werden die Krankenkassenprämien der obligatorischen Grundversicherung von der Sozialhilfe übernommen?"
    expected_refusal: false
    reference_answer: >-
      Ja, aber nur der selbst zu tragende Teil: Als Aufwandposition im Unterstützungsbudget
      zu berücksichtigen ist jener Teil der Prämien der obligatorischen Krankenversicherung,
      den unterstützte Personen nach Abzug der individuellen Prämienverbilligung selbst
      bezahlen müssen — ebenso Selbstbehalte und Franchisen. Die Gesundheitsversorgung im
      Rahmen der obligatorischen Grundversicherung nach KVG ist Teil der materiellen
      Grundsicherung und in jedem Fall zu gewährleisten. Diese Leistungen sind nicht
      rückerstattungspflichtig.
    expected_source:
      pages: [57]
      locator: "Materielle Grundsicherung / C.5 Medizinische Grundversorgung (Rz 1–2, Erläuterung b)"
    version_sensitive: false
    notes: "Präzisierung gegenüber der früheren Fassung: übernommen wird der Differenzbetrag nach IPV, nicht pauschal „die Prämie“ (C.5 Rz 2)."

  - id: SKOS-KV-02
    corpus: skos-richtlinien
    category: in_corpus
    question: "Was umfasst die medizinische Grundversorgung in der Sozialhilfe?"
    expected_refusal: false
    reference_answer: >-
      Prämien der obligatorischen Krankenversicherung sowie Kostenbeteiligungen
      (Franchise/Selbstbehalt) und Kosten der medizinischen Behandlung im Rahmen der
      Grundversicherung.
    expected_source:
      pages: [57]
      locator: "Materielle Grundsicherung / C.5 Medizinische Grundversorgung (Rz 1–3)"
    version_sensitive: false
    notes: "Eine der drei Säulen der materiellen Grundsicherung (GBL, Wohnen, med. Grundversorgung). Rz 3: besteht ausnahmsweise kein Versicherungsschutz, sind die Gesundheitskosten im Rahmen der KVG-Grundversicherung von der Sozialhilfe zu decken."

  - id: SKOS-IPV-01
    corpus: skos-richtlinien
    category: in_corpus
    question: "Muss eine unterstützte Person die individuelle Prämienverbilligung (IPV) beanspruchen?"
    expected_refusal: false
    reference_answer: >-
      Ja. Familien und Einzelpersonen in bescheidenen wirtschaftlichen Verhältnissen haben
      gegenüber dem Wohnkanton Anspruch auf Prämienverbilligung; nach dem
      Subsidiaritätsprinzip und der Pflicht zur Minderung der Bedürftigkeit ist dieser
      Anspruch geltend zu machen. Die Sozialhilfe übernimmt nur den Differenzbetrag, wenn
      die IPV die monatlichen Prämienkosten nicht deckt.
    expected_source:
      pages: [6, 14, 57]
      locator: "Materielle Grundsicherung / C.5 Erläuterungen a und b · Allgemeiner Teil / A.3 Rz 2 (Subsidiarität), A.4.1 Erläuterung d (Pflicht zur Minderung der Bedürftigkeit)"
    version_sensitive: false
    notes: "Früher wurde als Quelle das SKOS-Faktenblatt „IPV und Sozialhilfe“ genannt — das ist nicht Teil des Korpus. Die Aussage ist vollständig aus den Richtlinien selbst belegbar (C.5 Erl. a/b)."

  - id: SKOS-KV-AUF-01
    corpus: skos-richtlinien
    category: in_corpus
    question: "Kann von einer sozialhilfebeziehenden Person verlangt werden, in eine günstigere Krankenversicherung zu wechseln?"
    expected_refusal: false
    reference_answer: >-
      Im Grundsatz ja — die Ausrichtung wirtschaftlicher Hilfe kann mit Auflagen verbunden
      werden, und wer Sozialhilfe bezieht, muss alles Zumutbare unternehmen, um den
      Unterstützungsbedarf gering zu halten. Die Richtlinien nennen eine Auflage zur
      Auflösung eines Vertragsverhältnisses (Miete, Krankenkasse) aber ausdrücklich als
      möglichen Grundrechtseingriff: Sie muss sich auf eine ausreichende gesetzliche
      Grundlage stützen, verhältnismässig und zweckmässig sein, schriftlich ergehen und
      anfechtbar sein; die Rechts- und Handlungsfähigkeit der Person bleibt unangetastet. Ob
      und wie ein Kassenwechsel konkret verlangt werden kann, ergibt sich aus dem kantonalen
      Recht und ist nicht im Korpus.
    expected_source:
      pages: [14, 138, 139]
      locator: "Auflagen, Sanktionen, Ablehnung und Einstellung / F.1 Auflagen (Rz 1–2, Erläuterungen a–c) · Allgemeiner Teil / A.4.1 Erläuterung d"
    version_sensitive: false
    notes: "Korrigiert: das frühere schlichte „Ja, im Rahmen der Schadenminderungspflicht“ stammte aus dem ZH-Sozialhilfehandbuch, nicht aus dem Korpus — der Begriff „Schadenminderung“ kommt in den SKOS-Richtlinien nicht vor (dort: Pflicht zur Minderung der Bedürftigkeit). Testet, ob das System die grundrechtliche Einschränkung mitliefert statt pauschal zu bejahen."

  - id: SKOS-IPV-02
    corpus: skos-richtlinien
