    question: "Deckt die individuelle Prämienverbilligung (IPV) in allen Kantonen die gesamte obligatorische Krankenkassenprämie?"
    expected_refusal: false
    reference_answer: >-
      Nein. Höhe und Art der individuellen Prämienverbilligung sind von Kanton zu Kanton
      verschieden, ebenso die Anspruchsvoraussetzungen; die Richtlinien gehen ausdrücklich
      davon aus, dass die IPV die monatlichen Prämienkosten nicht decken kann — dann ist der
      Differenzbetrag Teil der materiellen Grundsicherung. Konkrete Zahlen zum ungedeckten
      Anteil stehen nicht im Korpus und dürfen nicht erfunden werden.
    expected_source:
