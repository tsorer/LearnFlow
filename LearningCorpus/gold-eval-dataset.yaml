  - id: SAMW-HFG-INKRAFT-01
    corpus: samw-leitfaden
    category: in_corpus
    question: "Wann ist das Humanforschungsgesetz (HFG) in Kraft getreten und welche drei Ausführungsverordnungen konkretisieren es?"
    expected_refusal: false
    reference_answer: >-
      Das HFG ist Anfang 2014 in Kraft getreten, zusammen mit drei ausführenden
      Verordnungen: der Verordnung über klinische Versuche (KlinV), der
      Humanforschungsverordnung (HFV) und der Organisationsverordnung HFG (OV-HFG).
    expected_source:
      pages: [24]
      locator: "Kapitel 3.2 – Schweiz"
    version_sensitive: false
    notes: "Alle drei Verordnungen müssen genannt sein."

  - id: SAMW-HFG-ZIELE-01
    corpus: samw-leitfaden
    category: in_corpus
    question: "Welche drei Ziele verfolgt der Gesetzgeber mit dem HFG?"
    expected_refusal: false
    reference_answer: >-
      (a) Schutz von Würde, Persönlichkeit und Gesundheit der in die Forschung einbezogenen
      Personen; (b) Schaffung günstiger Rahmenbedingungen für die Forschung; (c)
      Gewährleistung von Qualität und Transparenz der Forschung mit Menschen.
    expected_source:
      pages: [25]
      locator: "Kapitel 3.3 – HFG: Zweck und Geltungsbereich"
    version_sensitive: false
    notes: "Alle drei Ziele (a)–(c) müssen genannt sein."

  - id: SAMW-RISIKOKAT-01
    corpus: samw-leitfaden
    category: in_corpus
    question: "In welche Risikokategorien werden Forschungsvorhaben nach HFG eingeteilt, und welche weist das geringste Risiko auf?"
    expected_refusal: false
    reference_answer: >-
      Klinische Versuche bzw. Forschungsvorhaben mit Personen werden in die Kategorien A, B
      und C unterteilt, wobei A das geringste und C das höchste Risikopotential aufweist.
      Eine Kategorisierung ist nur bei Forschungsprojekten mit Personen vorgesehen (nicht z.
      B. bei bereits vorhandenem biologischem Material).
    expected_source:
      pages: [57]
      locator: "Kapitel 6.4 – Risikokategorisierung nach HFG"
    version_sensitive: true
    notes: "Kategorisierungssystem nach HFG/KlinV — gegen aktuelle Rechtslage prüfen."

  - id: SAMW-SUBSIDIARITAET-01
    corpus: samw-leitfaden
    category: in_corpus
    question: "Was besagt das „Prinzip der Subsidiarität” bei Forschung mit besonders vulnerablen Personen?"
    expected_refusal: false
    reference_answer: >-
      Besonders vulnerable Personen dürfen nur dann in ein Forschungsprojekt einbezogen
      werden, wenn gleichwertige Erkenntnisse anders nicht gewonnen werden können (Art. 11
      Abs. 2 HFG). Es soll verhindern, dass die Verletzlichkeit einer Gruppe ausgenutzt
      wird, um sie einfacher einzubeziehen.
    expected_source:
      pages: [41]
      locator: "Kapitel 5.1 – Konzept der Vulnerabilität"
    version_sensitive: false
    notes: "Bezug Art. 11 Abs. 2 HFG."

  - id: SAMW-JUGENDLICHE-01
    corpus: samw-leitfaden
    category: in_corpus
    question: "Ab welchem Alter gelten Kinder im Sinne des HFG als Jugendliche?"
    expected_refusal: false
    reference_answer: >-
      Als Jugendliche gelten Kinder ab Vollendung des 14. Lebensjahres. Der Leitfaden führt
      sie unter den vom HFG als besonders vulnerabel bezeichneten Personengruppen auf.
    expected_source:
      pages: [42]
      locator: "Kapitel 5.1 – Konzept der Vulnerabilität"
    version_sensitive: true
    notes: "Altersgrenze ist gesetzlich definiert — gegen aktuelle Rechtslage prüfen."

  - id: SAMW-NUERNBERG-01
    corpus: samw-leitfaden
    category: in_corpus
    question: "Was forderte der Nürnberger Kodex unter anderem für ethisch gerechtfertigte Humanversuche?"
    expected_refusal: false
    reference_answer: >-
      Unter anderem den sogenannten Informed Consent: die vollständige Aufklärung über
      Ziele, Verfahren, potentiellen Nutzen und Schaden des Versuchs sowie die freiwillige
      Zustimmung der Probandinnen und Probanden. Der Kodex umfasste zehn wesentliche Punkte
      und entstand im Nürnberger Kriegsverbrechertribunal 1946/47.
    expected_source:
      pages: [13]
      locator: "Kapitel 1 – Geschichte der Forschung mit Menschen"
    version_sensitive: false
    notes: "Historischer Kontext; Nürnberger Kodex, nicht WHO."

  - id: SAMW-ANONYM-01
    corpus: samw-leitfaden
    category: in_corpus
    question: "Welche drei Grade der Anonymisierung unterscheidet das Humanforschungsrecht?"
    expected_refusal: false
    reference_answer: >-
      Drei Grade: (1) anonymisiert — die betroffene Person lässt sich nur mit
      unverhältnismässigem Aufwand eruieren; (2) pseudonymisiert (verschlüsselt) —
      identifizierende Attribute sind durch ein Pseudonym ersetzt, der Schlüssel wird sicher
      und getrennt aufbewahrt; (3) identifizierend (unverschlüsselt) — die Person ist
      bestimmt oder bestimmbar.
    expected_source:
      pages: [95]
      locator: "Kapitel 12.3 – Anonymisierung und Re-Identifikation"
    version_sensitive: true
    notes: "Bezug Art. 25/26 HFV — gegen aktuelle Rechtslage prüfen."

  - id: SAMW-GENERALKONSENT-01
    corpus: samw-leitfaden
    category: in_corpus
    question: "Was versteht der Leitfaden unter einem „Generalkonsent”?"
    expected_refusal: false
    reference_answer: >-
      Eine spezielle Form der Einwilligung, bei der der Spender in die Weiterverwendung von
      Material und Daten für Forschungsprojekte einwilligt, die zum Zeitpunkt der
      Einwilligung erst in Zukunft definiert werden. Die Zustimmung muss freiwillig sein,
      ein Widerruf jederzeit möglich, und der Spender muss verstehen, worin er einwilligt.
    expected_source:
      pages: [76]
      locator: "Kapitel 8.8 – Generalkonsent"
    version_sensitive: false
    notes: ""

  - id: SAMW-SAETTIGUNG-01
