# LearnFlow - Gold-Eval-Dataset
#
# Eine Datei fuer alle drei Korpora, ohne Zusatzcode ladbar:
#     import yaml; data = yaml.safe_load(open(path, encoding="utf-8"))
#
# Status: Entwurf / Seed - noch nicht fachlich abgenommen (T-48, #96).
# Bezug: ADR-009 (Eval-Strategie), T-47 (#95).
#
# Quellreferenz-Schema
# --------------------
# expected_source ist (Dokument, pages) statt einer Chunk-ID:
#   - Das Dokument ergibt sich aus questions[].corpus. Der corpora-Block nennt
#     es zweimal, weil es zwei Dinge gibt und nicht eines:
#         path     - die Datei hier in LearningCorpus/. Nur fuer den Test und
#                    um die Seitenzahlen herzuleiten; nie ein Join-Kriterium.
#         filename - die Upload-Identitaet in documents (eindeutig ueber
#                    (area, filename), T-15). Darauf joint der Eval, und dieser
#                    Name steht ueber Citation.filename auch unter der Antwort,
#                    die der Nutzer liest (US-01).
#     Beide sind heute gleich, aber nur weil der Korpus so hochgeladen wird.
#     Wer ihn unter einem anderen Namen hochlaedt, laesst den Eval ins Leere
#     greifen, ohne dass am Retrieval etwas falsch waere -- deshalb steht die
#     Zusage hier, statt implizit zu bleiben. Geprueft ist sie erst, wenn der
#     Harness (T-28) sie gegen die DB haelt.
#   - Der Anker haengt am Content-Type und steht pro Korpus in corpora[].anchor.
#     parsing.py fuellt genau eines der beiden Felder, nie beide:
#         application/pdf  -> page gesetzt,    heading NULL  -> anchor: pages
#         .docx            -> page NULL,       heading gesetzt -> anchor: headings
#         text/markdown    -> page NULL,       heading gesetzt -> anchor: headings
#     Eine Frage traegt entsprechend "pages" ODER "headings", nie beides und
#     passend zum anchor ihres Korpus. Heute sind alle drei Korpora PDFs.
#   - pages sind 1-basierte PDF-Seiten, so wie app/services/parsing.py sie
#     zaehlt (enumerate(reader.pages, start=1)) und wie Citation.page sie
#     ausliefert. NICHT die im Dokument gedruckte Seitenzahl: der SAMW-Leitfaden
#     hat zwei ungezaehlte Blaetter vorn, PDF-Seite = gedruckte Seite + 2.
#   - pages ist eine Liste: chunking.py macht Seitengrenzen zu harten
#     Chunkgrenzen, ein Chunk umfasst also nie zwei Seiten. Antworten ueber
#     einen Seitenumbruch brauchen beide Seiten, sonst deckelt das den Recall.
#   - locator ist die Fundstelle in Prosa (Artikel/Kapitel/Randziffer). Nicht
#     maschinell ausgewertet - er traegt die fachliche Abnahme und erlaubt, die
#     Seitenzahlen bei einer neuen Dokumentfassung neu herzuleiten.
#
# Ein Treffer zaehlt als erwartete Quelle, wenn
#     chunk.document.filename == corpora[corpus].filename
# und, je nach corpora[corpus].anchor,
#     chunk.page in expected_source.pages
# oder chunk.heading in expected_source.headings.
#
# Bewusst NICHT im Schema:
#   - expected_source_id / Chunk-UUIDs: zeigen nach jeder Neu-Indexierung ins
#     Leere (anderes chunk_size, anderes Embedding-Modell, Re-Upload).
#   - heading als Anker fuer die heutigen Korpora: fuer PDFs immer NULL.
#     Fuer ein .docx- oder .md-Korpus waere es umgekehrt der einzig moegliche
#     Anker - dafuer ist corpora[].anchor da.
#   - area: heute auf PILOT_AREA festgenagelt, also ein Feld mit einem Wert.
#
# Verteilung: 80 Fragen - 45 in_corpus (56 %), 22 out_of_corpus (28 %),
# 13 adversarial (16 %). Das Zielband ~60/25/15 aus ADR-009 gilt fuer die
# Summe der drei Korpora, nicht je Korpus.
#
# IDs tragen ein Korpus-Praefix (SKOS-, AIA-, SAMW-): die out-of-corpus- und
# adversarial-Eintraege waren in den drei Seed-Sets identisch durchnummeriert.
#
# Beim Zusammenfuehren repariert: drei Fragen im EU-AI-Act-Seed waren kein
# gueltiges YAML - ein deutsches oeffnendes Anfuehrungszeichen mit einem
# ASCII-" als Schluss beendete den quotierten Skalar zu frueh.

version: 1

corpora:
  skos-richtlinien:
    path: "SKOS-Richtlinien_-_Version_vom_1.1.2026.pdf"
    filename: "SKOS-Richtlinien_-_Version_vom_1.1.2026.pdf"
    title: "SKOS-Richtlinien, Fassung vom 1.1.2026"
    content_type: "application/pdf"
    anchor: pages
  eu-ai-act:
    path: "EU_AI_ACT_OJ_L_202401689_DE_TXT.pdf"
    filename: "EU_AI_ACT_OJ_L_202401689_DE_TXT.pdf"
    title: "Verordnung (EU) 2024/1689 (EU AI Act), Amtsblatt DE"
    content_type: "application/pdf"
    anchor: pages
  samw-leitfaden:
    path: "leitfaden_samw_forschung_menschen_2_auflage_2015.pdf"
