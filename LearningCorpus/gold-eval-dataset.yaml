  - id: AIA-PROTOKOLL-02
    corpus: eu-ai-act
    category: in_corpus
    question: "Welches übergeordnete Ziel verfolgen die Protokollierungsfunktionen bei Hochrisiko-KI-Systemen?"
    expected_refusal: false
    reference_answer: >-
      Die Protokollierungsfunktionen dienen der Gewährleistung, dass das Funktionieren des
      Hochrisiko-KI-Systems in einem der Zweckbestimmung angemessenen Masse rückverfolgbar
      ist — sie ermöglichen Nachverfolgbarkeit und Transparenz des Systemverhaltens
      entsprechend der vorgesehenen Verwendung.
    expected_source:
      pages: [59]
      locator: "Artikel 12 – Aufzeichnungspflichten"
    version_sensitive: false
    notes: ""

  - id: AIA-PROTOKOLL-03
    corpus: eu-ai-act
    category: in_corpus
    question: "Auf welche drei konkreten Zwecke hin müssen Protokollierungsfunktionen Ereignisse aufzeichnen?"
    expected_refusal: false
    reference_answer: >-
      Die Protokollierungsfunktionen müssen Ereignisse aufzeichnen, die relevant sind für:
      (a) die Ermittlung von Situationen, die dazu führen können, dass das System ein Risiko
      im Sinne von Artikel 79 Absatz 1 birgt oder dass es zu einer wesentlichen Änderung
      kommt; (b) die Erleichterung der Beobachtung nach dem Inverkehrbringen gemäss Artikel
      72; (c) die Überwachung des Betriebs der Hochrisiko-KI-Systeme gemäss Artikel 26
      Absatz 5.
    expected_source:
      pages: [59]
      locator: "Artikel 12 – Aufzeichnungspflichten"
    version_sensitive: false
    notes: "Alle drei Zwecke (a)–(c) müssen genannt sein."

  - id: AIA-TRANSPARENZ-01
    corpus: eu-ai-act
    category: in_corpus
    question: "Welche Anforderung an die Transparenz von Hochrisiko-KI-Systemen muss bei deren Konzeption und Entwicklung erfüllt werden, und zu welchem Zweck?"
    expected_refusal: false
    reference_answer: >-
      Hochrisiko-KI-Systeme müssen so konzipiert und entwickelt werden, dass ihr Betrieb
      hinreichend transparent ist, damit die Betreiber die Ausgaben angemessen
      interpretieren und verwenden können. Die Transparenz wird auf eine geeignete Art und
      in einem angemessenen Masse gewährleistet, damit Anbieter und Betreiber ihre in
      Abschnitt 3 festgelegten Pflichten erfüllen können.
    expected_source:
      pages: [59]
      locator: "Artikel 13 – Transparenz und Bereitstellung von Informationen"
    version_sensitive: false
    notes: ""

